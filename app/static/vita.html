            <div id="bootSkel" hidden aria-hidden="true">
            <div class="skel" style="height:36px;width:150px;border-radius:18px;margin-top:14px"></div>
            <div class="skel" style="height:230px;width:230px;border-radius:50%;margin:26px auto 0"></div>
            <div class="skel" style="height:26px;width:190px;border-radius:13px;margin:20px auto 0"></div>
            <div class="skel" style="height:64px;width:100%;border-radius:18px;margin-top:32px"></div>
          </div>
          <div id="bootErr" hidden>
            <svg class="ic beIc" viewBox="0 0 24 24"><path d="M12 4 2.8 20h18.4Z"/><path d="M12 10.2v4.3"/><path d="M12 17.6v.05"/></svg>
            <h2>Не удалось загрузить данные</h2>
            <p id="bootErrMsg">Сервис недоступен. Проверь соединение и попробуй ещё раз.</p>
            <button id="bootRetry" class="press">Повторить</button>

              <button class="idxBtn" data-a="index" aria-label="Прогноз дня: из чего он"><div class="arcBox" id="arcBox"></div>
              <div class="bioBig" id="dayNum">—</div>
              <div class="bioSub" id="dayLbl">Индекс дня</div></button>
              <button class="verdict press" id="verdict" data-a="verdict"><span class="vk" id="vKick"></span><span class="vt"><span id="emo"></span><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>
            </div>
            <div id="needYou"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ВРАЧ — макет v7: консилиум · заключение · медпаспорт строками, одна карточка сдачи -->
    <section class="tab" data-tab="plan" aria-label="Врач">
      <div class="screen" id="s-plan">
        <div class="rise" style="--i:0"><h1 class="title">Врач</h1></div>
        <div class="rows rise" style="--i:1;margin-top:18px" id="docRows"></div>
        <div class="secH rise" style="--i:2;margin-top:28px" id="drawH"><span class="lbl">Анализы</span></div>
        <div class="nextDraw rise" style="--i:2" id="nextDraw"></div>
        <div class="dates rise" style="--i:3" id="dates"></div>
      </div>

    <section class="tab" data-tab="cases" aria-label="Проверки">
      <div class="screen" id="s-cases">
        <div class="rise" style="--i:0"><h1 class="title">Проверки</h1></div>
        <div class="seg rise" style="--i:1" id="qSeg" role="tablist"></div>
        <div class="rise" style="--i:2" id="qList"></div>

    <!-- Я — макет v7: паспорт и биовозраст рядом, лесенка PhenoAge, что дало, системы -->

  </main>

  <nav class="tabbar" id="tabbar" role="tablist">
    <span class="tb-pill" id="tbPill"></span>
    <button class="tb on press" data-go="today" role="tab" aria-selected="true"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17.5h18M6.5 20.5h11"/><path d="M7 17.5a5 5 0 0 1 10 0"/><path d="M12 6.5V4M6.3 9.3 4.6 7.6M17.7 9.3l1.7-1.7M3.5 13.5h1.6M18.9 13.5h1.6"/></svg></span>Сегодня</button>
    <button class="tb press" data-go="cases" role="tab" aria-selected="false"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="16.5" r="2.2"/><circle cx="11.5" cy="6" r="2.2"/><circle cx="18.5" cy="14" r="2.2"/><path d="M7 14.5l3.4-6.5M13.3 7.3l3.8 5M8.2 16.2l8.1-1.8"/></svg><i class="badge" id="caseBadge"></i></span>Проверки</button>
    <button class="tb press" data-go="plan" role="tab" aria-selected="false"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M6.5 3.5v5a4.5 4.5 0 0 0 9 0v-5"/><path d="M5 3.5h3M14 3.5h3"/><path d="M11 13v2.5a4.5 4.5 0 0 0 9 0v-1.5"/><circle cx="20" cy="12" r="1.8"/></svg><i class="badge" id="planBadge"></i></span>Врач</button>

  <div class="ov" id="ov" role="dialog" aria-modal="true" tabindex="-1"><div class="screen" id="ovScreen"></div></div>

</div>
<script>
(()=>{
/* Vita v2, этап 1 (2026-09-28) — перенос макета (index.html, GitHub Occupancy3537/Vita,
   ветка main) в прод на живых данных /vita/today + /vita/rhythm + /vita/yesterday.
   Дизайн (CSS, шторки-контейнер-трансформ, анимации) — без изменений из макета.
   Сверка с макетом v7 (2026-09-28): «Врач» и «Я» — на живых данных
   /vita/doctor, /vita/me, /vita/medpassport; главная — слово + короткое
   действие «→ прогноз», без строки проверок; «Решить» — решения на месте.
   Из мокапа убраны: PRESETS/переключатель состояний, вся мок-модель TD/IDX/B_/
   EVENTS/STREAKS/CONC/CQ/REP/EPS/LABS/панели сдачи — заменены живыми данными
   ровно там, где реальный бэкенд их даёт (см. ПЛАН СБОРКИ в git-истории макета).*/
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const haptic=(ms=6)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const eo4=t=>1-Math.pow(1-t,4);
function tween(dur,fn,ease=eo4){return new Promise(res=>{if(reduce){fn(1);res();return}const t0=performance.now();const f=n=>{const t=Math.min(1,(n-t0)/dur);fn(ease(t));t<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)})}
/* русский вид чисел в строках с бэкенда: запятая, минус, степени, единицы нагрузки */
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const GLABEL={exc:'Отлично',normal:'Норма',watch:'На контроле',out:'Вне референса'};
function openLabGroup(i){$$('.labsGroup').forEach(el=>{const on=el.dataset.g===String(i)&&!el.classList.contains('open');el.classList.toggle('open',on);const b=$('.labsGH',el);b&&b.setAttribute('aria-expanded',on)})}
const rn=x=>String(x==null?'':x).replace(/(^|[\s(])-(?=\d)/g,'$1−').replace(/(?<![\d.])(\d+)\.(\d+)(?!\.\d)/g,'$1,$2').replace(/10\^(\d+)/g,(m,d)=>'10'+[...d].map(c=>SUP[c]).join('')).replace(/\bLOW\b/g,'ниже обычного').replace(/\bHIGH\b/g,'выше обычного').replace(/\b(OPTIMAL|NORMAL)\b/g,'в норме');
const rn0=x=>rn(x).replace(/(\d+),0(?!\d)/g,'$1');
const IDX_LABEL={'ACWR (Garmin)':'Нагрузка за неделю'};
const fmt=(v,dec=0)=>dec?v.toFixed(dec).replace('.',','):Math.round(v).toLocaleString('ru-RU');
function countUp(el,to,{dur=1400,dec=0,from=0}={}){tween(dur,p=>{el.textContent=fmt(from+(to-from)*p,dec)})}
const replay=el=>{if(!el)return;el.classList.remove('go');void el.getBoundingClientRect();el.classList.add('go')};
const ACCENT='var(--accent)';

/* ================= ГРАФИК (перенесено из макета дословно, без изменений — ================= */
/* чистые функции от готовых чисел, ничего мокового) */
let gid=0;
function smooth(p){let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c,t=1/6;d+=` C${(b[0]+(c[0]-a[0])*t).toFixed(1)},${(b[1]+(c[1]-a[1])*t).toFixed(1)} ${(c[0]-(e[0]-b[0])*t).toFixed(1)},${(c[1]-(e[1]-b[1])*t).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`}return d}
const pulseDot=(x,y,c)=>`<g class="pdot"><circle cx="${x}" cy="${y}" r="4" fill="${c}" opacity=".4"><animate attributeName="r" values="4;13" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;0" dur="2.6s" repeatCount="indefinite"/></circle></g>`;
const WDS=['вс','пн','вт','ср','чт','пт','сб'];
const chartDates=h=>{const n=h.length;return n<3?[]:[0,Math.floor(n/2),n-1].map(i=>[i,shortDate(h[i].date)])};
/* длинный пункт консилиума → жирная суть + серое пояснение */
function actSplit(t){t=(t||'').trim();const seps=[': ',' — ','; ',' (','. '];let pos=-1,len=0;
  for(const sp of seps){const i=t.indexOf(sp);if(i>=14&&i<=110&&(pos<0||i<pos)){pos=i;len=sp.length}}
  if(pos<0){if(t.length<=110)return[t,''];const cut=t.slice(0,100).replace(/\s+\S*$/,'');return[cut+'…',t.slice(cut.length).trim()]}
  const lead=t.slice(0,pos).trim(),rest=t.slice(pos+len).trim();return[lead.charAt(0).toUpperCase()+lead.slice(1),rest.charAt(0).toUpperCase()+rest.slice(1)]}
function lineChart({data,w=320,h=140,color=ACCENT,min,max,base=null,labels=null,marks=[],xt=null,lastText=null,baseText=null,straight=false,padT=14,padB=(labels||xt)?20:6}){
  if(!data||data.length<2)return '<p class="empty">Пока мало данных для графика.</p>';
  const id='g'+(gid++);min=min??Math.min(...data)-.5;max=max??Math.max(...data)+.5;
  const ih=h-padT-padB,x=i=>6+i*(w-12)/(data.length-1),y=v=>padT+ih-(v-min)/(max-min)*ih;
  const pts=data.map((v,i)=>[x(i),y(v)]),d=straight?'M'+pts.map(q=>q.join(',')).join(' L'):smooth(pts),L=pts[pts.length-1];
  const bl=base!=null?`<line class="fadein" x1="0" x2="${w}" y1="${y(base)}" y2="${y(base)}" stroke="${color}" stroke-width="1" stroke-dasharray="2 5" stroke-linecap="round" opacity=".5"/>`:'';
  const mk=marks.map(i=>`<line class="fadein" x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${h-padB}" stroke="${color}" stroke-width="1" stroke-dasharray="1.5 4" opacity=".55"/><circle class="pdot" cx="${x(i)}" cy="${y(data[i])}" r="3.4" fill="${color}" stroke="var(--bg)" stroke-width="1.5"/>`).join('');
  const lab=(labels?labels.map(([t,a,xx])=>`<text class="xl" x="${xx}" y="${h-4}" text-anchor="${a}">${t}</text>`).join(''):'')
    +(xt?xt.map(([i,t])=>`<text class="xl" x="${x(i)}" y="${h-4}" text-anchor="${i===0?'start':i===data.length-1?'end':'middle'}">${t}</text>`).join(''):'')
    +(baseText&&base!=null?`<text class="xl" x="8" y="${y(base)+13}" text-anchor="start">${baseText}</text>`:'')
    +(lastText?`<text class="xl" x="${Math.min(L[0],w-4)}" y="${Math.max(L[1]-9,10)}" text-anchor="end" style="fill:var(--ink);font-weight:600">${lastText}</text>`:'');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${bl}<path class="area" d="${d} L${L[0]},${h-padB} L${pts[0][0]},${h-padB} Z" fill="url(#${id})"/>
  <path class="draw" pathLength="1" d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${mk}
  ${pulseDot(L[0],L[1],color)}<circle class="pdot" cx="${L[0]}" cy="${L[1]}" r="3.2" fill="var(--bg)" stroke="${color}" stroke-width="2"/>${lab}</svg>`;
}
/* Реальные публикации (card.publication, /vita/topic/*) — тот же вид, что в
   макете (pubList), но без выдуманного PUB{} и без фейковой ссылки: открывает
   настоящий url публикации, если он есть, иначе просто показывает карточку. */
function pubList(pubs,title='Свежее по теме',i=6){
  if(!pubs||!pubs.length)return '';
  /* Живая просьба Влада (2026-09-30): статьи не занимают экран — свёрнуты в одну строку «Свежее по теме» */
  const items=pubs.map(p=>{
    const tag=p.url?`<a class="pub press" href="${esc(p.url)}" target="_blank" rel="noopener">`:`<div class="pub">`;
    const close=p.url?'</a>':'</div>';
    return `${tag}<div class="pt">${esc(p.title)}</div><div class="pr2"><span class="tag">${esc(p.grade)}</span>${p.why?`<span class="pw2">${esc(p.why)}</span>`:''}${p.url?`<span class="pl">открыть${svg('right')}</span>`:''}</div>${close}`;
  }).join('');
  const n=pubs.length;
  return `<div class="pubs rise" style="--i:${i}"><div class="accS"><button class="accH" data-a="pubtoggle" aria-expanded="false"><span class="accT"><b>${title}</b><small>${n} ${plural(n,'исследование','исследования','исследований')}</small></span>${svg('chev','ic chev')}</button><div class="accB"><div>${items}</div></div></div></div>`;
}

/* ================= ДАННЫЕ: живые /vita/today + /vita/rhythm + /vita/yesterday ================= */
let TODAY=null, RHYTHM=null, YEST=null, yestLoaded=false;
/* таймаут fetch 10 c + один авто-retry для GET (аудит Qwen, P1); POST не повторяем — не идемпотентен */
async function fetchT(url,opt={},retriable){const hasAC=typeof AbortController!=='undefined';
  for(let a=0;;a++){const ac=hasAC?new AbortController():null,tm=ac?setTimeout(()=>ac.abort(),10000):null;
    try{const r=await fetch(url,{credentials:'same-origin',...opt,...(ac?{signal:ac.signal}:{})});
      if(r.status===401){location.href='/vita/login';throw new Error('401')}
      if(retriable&&a===0&&(r.status>=500||r.status===429))continue;
      return r}
    catch(e){if(retriable&&a===0&&ac&&e.name==='AbortError')continue;throw e}
    finally{if(tm)clearTimeout(tm)}}}
async function fetchJSON(url){const r=await fetchT(url,{},true);if(!r.ok&&r.status!==404)throw new Error('HTTP '+r.status);return r.status===404?null:r.json()}
async function postJSON(url,body){const r=await fetchT(url,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)},false);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function loadToday(){[TODAY,RHYTHM]=await Promise.all([fetchJSON('/vita/today'),fetchJSON('/vita/rhythm')]);if(!TODAY)throw new Error('HTTP 404')}
async function loadYesterday(){if(!yestLoaded){YEST=await fetchJSON('/vita/yesterday');yestLoaded=true}return YEST}

const ICON_BY_SEGMENT={recovery:'charge',sleep:'moon',move:'steps',food:'bowl'};
const NAME_BY_SEGMENT={recovery:'Заряд',sleep:'Сон',move:'Движение',food:'Питание'};

/* «Всё хорошо»/«Можно улучшить»/«Нет данных»/«День закрыт» — сервер шлёт ФЛАГИ
   (state.no_watch/closed, ring.score), слово выбирает клиент — тот же принцип,
   что установил ещё Vita v1 (см. докстринг app/vita.py::build_state). */
function verdictWord(){
  /* Макет v7: слово-вердикт + ОДНО короткое действие со стрелкой к прогнозу
     («Творог или курица на ужин → 86»). «Всё хорошо» — только когда делать
     нечего (подсказки нет); есть подсказка — «Можно улучшить», каким бы ни
     был индекс. Полный текст подсказки — в шторке по тапу. */
  const st=TODAY.state,score=TODAY.ring.score,ahead=TODAY.ring.ahead,n=TODAY.nudge,w=TODAY.week;
  const arrow=(ahead!=null&&score!=null&&ahead>score)?` → ${ahead}`:'';
  if(st.no_watch)return {k:'none',w:'Нет данных',t:'Надень часы'};
  if(st.closed)return {k:'closed',w:'День закрыт',t:score==null?'Сутки позади':score>80?'Главное сделано':`Закрыт на ${score}`};
  if(st.sunday&&w&&w.days)return {k:'week',w:'Неделя',t:`${w.green} из ${w.days} ${plural(w.days,'дня','дней','дней')} в зелёной зоне`};
  if(st.no_food)return {k:'none',w:'Видно полдня',t:n&&n.short?n.short:'Запиши первый приём'};
  if(score==null)return {k:'none',w:'Нет данных',t:'Пока рано подводить итог'};
  if(n)return {k:'up',w:'Можно улучшить',t:(n.short||n.text)+arrow};
  return {k:'ok',w:'Всё хорошо',t:'Всё в коридоре'};
}

/* ================= ГЛАВНАЯ «СЕГОДНЯ» ================= */
function chipsFor(){
  const cs=TODAY.chip_status,ch=TODAY.chips||{};
  /* Живая жалоба (2026-09-28): «сон 7:16 — это 100, а 8:00 будет 120?» —
     кругляши «Сон»/«Заряд» показывали судейский скор (100 при любом «не
     плохо»), не настоящее число. Теперь — реальные Body Battery/Оценка сна
     Гармина (совпадает с тем, чем красится chip_status на бэкенде), запасной
     путь — прежний судейский скор, если часы сегодня ничего не дали. */
  const seg={recovery:ch.energy??TODAY.ring.recovery_score,sleep:ch.sleep_quality??TODAY.ring.sleep_score,
             move:TODAY.ring.movement_score,food:TODAY.ring.nutrition_score};
  const out=[];
  for(const k of ['recovery','sleep','move','food']){
    const v=seg[k];if(v==null)continue;
    out.push({k,ic:ICON_BY_SEGMENT[k],v:Math.round(v),l:NAME_BY_SEGMENT[k],p:v/100,st:cs[k]||'neutral'});
  }
  return out;
}

/* фон-фото: высота = низ hero + зона растворения; параллакс при скролле */
const todayTab=$('#todayTab'),todayBg=$('#todayBg'),sToday=$('#s-today');let pgProg=0;
function sizeBg(){const tr=todayTab.getBoundingClientRect(),hr=$('#heroBox').getBoundingClientRect();
  todayBg.style.setProperty('--bgH',Math.round(hr.bottom-tr.top+sToday.scrollTop+30)+'px')}
function updBg(){const y=sToday.scrollTop;
  todayBg.style.transform=`translate3d(${(-pgProg*22).toFixed(2)}%,${(-y*.45).toFixed(1)}px,0)`;
  todayBg.style.opacity=((1-pgProg)*(1-Math.min(1,y/700)*.5)).toFixed(3);
  todayTab.classList.toggle('scrolled',y>12)}
sToday.addEventListener('scroll',()=>{todayBg.style.transition='none';updBg()},{passive:true});
addEventListener('resize',sizeBg);
document.fonts&&document.fonts.ready.then(sizeBg);

let kbNext=true,arcGen=0;
function reveal(root){$$('.rise',root).forEach(e=>e.classList.remove('in'));void root.offsetWidth;$$('.rise',root).forEach(e=>e.classList.add('in'))}
function enterToday(){
  reveal(sToday);const g=++arcGen;
  if(kbNext){todayTab.classList.remove('kb');void todayTab.offsetWidth;todayTab.classList.add('kb');kbNext=false}
  const svgEl=$('#arcSvg'),val=$('#arcVal'),glow=$('#arcGlow'),ahead=$('#arcAhead'),track=$('#arcTrack'),crown=$('#crown'),dotG=$('#arcDotG'),num=$('#dayNum');
  const L=track.getTotalLength(),at=v=>track.getPointAtLength(L*Math.max(.001,v)/100);
  svgEl.classList.remove('live');$$('.arcTick',svgEl).forEach(t=>t.classList.remove('in'));
  const score=TODAY.ring.score;
  track.classList.toggle('empty',score==null);
  val.style.strokeDashoffset=100;glow.style.strokeDashoffset=100;ahead.setAttribute('stroke-dasharray','0 100');
  crown.classList.remove('show');dotG.classList.remove('on');
  const C=2*Math.PI*28;
  $$('#chips .ring circle').forEach(c=>{c.style.transition='none';c.style.strokeDasharray=`0 ${C}`;void c.getBoundingClientRect();c.style.transition='';setTimeout(()=>c.style.strokeDasharray=`${c.dataset.d} ${C}`,260)});
  $('#streaks').classList.remove('plus');
  sizeBg();updBg();
  if(score==null){num.textContent='—';return}
  const V=score;dotG.classList.add('on');
  tween(1600,p=>{if(g!==arcGen)return;const v=V*p,pt=at(v);val.style.strokeDashoffset=100-v;glow.style.strokeDashoffset=100-v;dotG.setAttribute('transform',`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);num.textContent=Math.round(v)},t=>1-Math.pow(1-t,3.2)).then(()=>{if(g!==arcGen)return;
    $$('.arcTick',svgEl).forEach(t=>t.classList.toggle('in',+t.dataset.f<=V/100));svgEl.classList.add('live');
    if(crownOn())crown.classList.add('show');
    if(TODAY.state.closed){void $('#streaks').offsetWidth;$('#streaks').classList.add('plus')}
    const ahead_v=TODAY.ring.ahead;
    if(ahead_v!=null&&ahead_v>V){const A=ahead_v-V;ahead.setAttribute('stroke-dashoffset',-V);tween(1000,p=>ahead.setAttribute('stroke-dasharray',`${A*p} 100`))}
  });
}

    FOODT=T;

    const tile=(l,x,u,tap)=>{const c=x&&x.consumed,t=x&&x.target,w=c!=null&&t?Math.min(100,c/t*100):0,tag=tap?'button':'div';
      return `<${tag} class="mac${tap?' tapm':''}"${tap?' data-a="macsrc"':''}><span class="lbl">${l}${tap?svg('chev','ic mchev'):''}</span><b>${c!=null?fmt(c):'—'}</b><span class="of">${t?`из ${fmt(t)}${u?' '+u:''}`:'цель не задана'}</span><div class="mb"><i style="width:${w}%"></i></div></${tag}>`};

  /* «Вчера» из шторки «Питание» — макет v7: приёмы пищи с белком, AHEI и растения недели, свежее по теме */

/* ================= PULL-TO-REFRESH =================
   Живая жалоба (2026-09-28): «по свайпу нет обновления приложения» —
   тянешь вниз от самого верха списка, отпускаешь после порога, данные
   текущей вкладки перезагружаются. */
function attachPullToRefresh(el,onRefresh){
  /* Живая жалоба (2026-09-28): «свайп вниз для обновления должен сдвигать
     страницу» — раньше был только индикатор поверх, сам экран не двигался.
     Теперь тянет саму секцию (transform, с сопротивлением), открывая
     спиннер сверху. touchmove — НЕ passive и с preventDefault() только пока
     реально тянем: без этого браузер сам перехватывает overscroll у нуля
     скролла (нативный pull-to-refresh Chrome), из-за чего наш жест мог и не
     срабатывать вовсе — overscroll-behavior-y:contain на .screen (CSS) это
     дополнительно глушит. */

  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!pulling)return;

    }else pulling=false;

    setTimeout(()=>{el.style.transition=''},300)};

    }else{release();pr.style.opacity=''}

  };
  el.addEventListener('touchend',finish,{passive:true});

    case'index':openSheet('index',null,t);break;
    case'streaks':TRIP_PICK=false;openSheet('streaks',null,t);break;
    case'labgroup':haptic();openLabGroup(t.dataset.g);break;
    case'drvall':haptic();ME_ALL=!ME_ALL;renderMe();break;
    case'rxmark':haptic();postJSON('/vita/manual-mark',{date:t.dataset.d,field_key:k,value:true}).then(()=>loadToday()).then(()=>{renderChecksTab&&renderChecksTab()}).catch(()=>toast('Не получилось — попробуй ещё раз'));break;
    case'tripbtn':haptic();if((TODAY.travel||{}).active){tripSet(null,'Режим поездки выключен')}else{TRIP_PICK=!TRIP_PICK;refreshSheet()}break;
    case'tripgo':haptic();tripSet(+k,'Режим поездки включён: питание на паузе, сон и шаги как обычно');break;
    case'tripend':haptic();tripSet(null,'Режим поездки выключен');break;
    case'recovery':fetchJSON('/vita/topic/recovery').then(detail=>openSheet('segment',{k:'recovery',detail},t));break;
    case'dayback':haptic();loadYesterday().then(snap=>{openSheet('yesterday',snap,t)});break;
    case'close':closeSheet();break;
    case'toast':haptic();toast(t.dataset.msg);break;
    case'theme':haptic();setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(typeof ME!=='undefined'&&ME)renderMe();break;
    case'inbox':haptic();loadChecks().catch(()=>{}).then(()=>openSheet('inbox',null,t));break;
    case'consrep':case'notes':case'draw':haptic();openSheet(a,null,t);break;
    case'macsrc':{haptic();const ps=$('#protSrc');if(ps){ps.hidden=!ps.hidden;t.classList.toggle('on',!ps.hidden)}break}
    case'lever':{haptic();const lv=t.closest('.lever'),on=!lv.classList.contains('open');$$('.lever',ovS).forEach(x=>{x.classList.remove('open');const b=$('.lever-h',x);b&&b.setAttribute('aria-expanded','false')});if(on){lv.classList.add('open');t.setAttribute('aria-expanded','true')}break}
    case'micro':{haptic();const w=t.closest('.hmW'),on=!w.classList.contains('open');$$('.hmW',ovS).forEach(x=>x.classList.remove('open'));w.classList.toggle('open',on);break}
    case'foodyest':haptic();openSheet('foodYest',null,t);break;
    case'medpass':haptic();loadMedp().then(mp=>openSheet('medpass',mp,t)).catch(()=>toast('Не удалось загрузить медпаспорт'));break;
    case'pubtoggle':{haptic();const sec=t.closest('.accS'),on=!sec.classList.contains('open');sec.classList.toggle('open',on);t.setAttribute('aria-expanded',on);break}
    case'acc':{haptic();const sec=t.closest('.accS'),on=!sec.classList.contains('open');sec.classList.toggle('open',on);t.setAttribute('aria-expanded',on);drawAcc=on?t.dataset.k:null;break}
    case'lab':{haptic();const k=t.dataset.k;if(!k||k===curLab)break;
      fetchJSON('/vita/doctor?lab='+encodeURIComponent(k)+'&panel='+curPanel).then(doc=>{DOC=doc;curLab=k;renderDoctor();refreshSheet()}).catch(()=>toast('Не удалось пересчитать под лабу'));break}
    case'drawp':{haptic();const i=Math.max(0,+t.dataset.k||0);
      fetchJSON('/vita/doctor?panel='+i+(curLab?'&lab='+encodeURIComponent(curLab):'')).then(doc=>{DOC=doc;curPanel=i;renderDoctor();openSheet('draw',null,t)}).catch(()=>toast('Не удалось открыть сдачу'));break}
    case'copydraw':{haptic();const x=DOC&&DOC.next_draw&&DOC.next_draw.export_text;if(!x)break;
      (navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast('Список скопирован — вставь в заявку лаборатории.')).catch(()=>toast('Не удалось скопировать'));break}
    case'gochecks':haptic();if(ov.classList.contains('open'))closeSheet();if(k)qMode=k;goTab('cases',true);break;
    case'qseg':haptic();qMode=k;renderChecksTab();break;
    case'question':haptic();openSheet('question',k,t);break;
    case'check':haptic();openSheet('check',k,t);break;
    case'evidence':haptic();fetchJSON('/vita/cases/'+k+'/evidence').then(ev=>openSheet('evidence',ev,t));break;
    case'qcheck':{haptic();const q=((CHECKS&&CHECKS.items.questions)||[]).find(x=>x.id===k);if(!q)break;
      postJSON('/vita/questions/resolve',{question_id:q.id,source:q.source==='детектив'?'detective':'disagreement',
        action:'check',title:q.title,problem_id:q.problem_id,factor:q.factor,lag_days:q.lag_days})
        .then(()=>{closeSheet();loadChecks(true).then(()=>{renderChecksTab();loadToday().then(renderToday)});toast('Проверка началась — она в «Проверках».')});
      break}
    case'qdecline':{haptic();const q=((CHECKS&&CHECKS.items.questions)||[]).find(x=>x.id===k);if(!q)break;
      postJSON('/vita/questions/resolve',{question_id:q.id,source:q.source==='детектив'?'detective':'disagreement',
        action:'decline',title:q.title})
        .then(()=>{closeSheet();loadChecks(true).then(renderChecksTab);toast('Вопрос отклонён.')});
      break}
  }
});

/* ================= BOOT ================= */
let savedTheme='light';try{savedTheme=localStorage.getItem('vita-theme')||'light'}catch(e){}
setTheme(savedTheme);
/* offline-баннер (аудит Qwen, P1) */
const netBan=$('#netBan');
function netUpd(){if(netBan)netBan.hidden=navigator.onLine}
addEventListener('online',()=>{netUpd();toast('Соединение восстановлено')});
addEventListener('offline',netUpd);netUpd();
/* boot: скелетон → данные; при ошибке — error-state с «Повторить» (аудит Qwen, P1) */
function bootLoad(){
  sToday.classList.add('booting');
  const sk=$('#bootSkel');if(sk)sk.hidden=false;
  const be=$('#bootErr');if(be)be.hidden=true;
  loadToday().then(()=>{renderToday();requestAnimationFrame(()=>requestAnimationFrame(()=>enterToday()))}).catch(err=>{
    console.error('Vita: не удалось загрузить /vita/today',err);
    sToday.classList.remove('booting');
    if(sk)sk.hidden=true;
    if(be){be.hidden=false;const m=$('#bootErrMsg');if(m)m.textContent='Сервис недоступен'+(err&&err.message&&err.message!=='401'?' ('+err.message+')':'')+'. Проверь соединение и попробуй ещё раз.'}
  });
}
$('#bootRetry').addEventListener('click',bootLoad);
bootLoad();
})();
</script>
