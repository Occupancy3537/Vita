:root{
  color-scheme:light;
  --bg:#F7F6F3;
  --ink:#1D1B18; --ink2:#5B564E; --muted:#726C63; --faint:#CFC9BE;
  --line:rgba(29,27,24,.10); --line-soft:rgba(29,27,24,.05);
  --accent:#2C8981; --accent-ink:#1E6C66; --accent-soft:rgba(44,137,129,.12); --accent-glow:rgba(44,137,129,.35);
  --warm:#C2663E; --warm-ink:#9C4E30; --warm-soft:rgba(194,102,62,.12);
  --green:#4A8A4F; --amber:#9A7D1E; --gold:#B8903A; --teal:#2C8981;
  --t-sleep:linear-gradient(150deg,#E2EBEF 0%,#EEF1EF 100%); --g-sleep:rgba(92,140,190,.20);
  --t-hrv:linear-gradient(150deg,#E1EDE6 0%,#EFF1EC 100%); --g-hrv:rgba(44,137,129,.20);
  --t-energy:linear-gradient(150deg,#EFEBD9 0%,#F2F0E8 100%); --g-energy:rgba(190,160,60,.22);
  --t-warm:linear-gradient(150deg,#F3E4DA 0%,#F5EFEA 100%); --g-warm:rgba(194,102,62,.20);
  --t-neutral:linear-gradient(150deg,#ECEAE4 0%,#F3F1ED 100%); --g-neutral:rgba(44,137,129,.10);
  --card-edge:rgba(29,27,24,.06); --chip-bg:rgba(255,255,255,.55);
  --g-exc-fg:#1E6C66; --g-exc-bg:rgba(44,137,129,.12);
  --g-normal-fg:#5B564E; --g-normal-bg:rgba(29,27,24,.055);
  --g-watch-fg:#9C4E30; --g-watch-bg:rgba(194,102,62,.14);
  --g-out-fg:#9A3C2C; --g-out-bg:rgba(154,60,44,.13);
  --shadow-float:0 14px 40px rgba(29,27,24,.14); --shadow-frame:0 30px 90px rgba(29,27,24,.14);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Spectral","Iowan Old Style",Georgia,serif;
  --surface:#EFEDE8; --surface-hi:#FBFAF8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1214;
  --surface:#181C1F; --surface-hi:#20252A;
  --ink:#F1EEE7; --ink2:#B3ADA3; --muted:#8F897F; --faint:#3C3936;
  --line:rgba(241,238,231,.10); --line-soft:rgba(241,238,231,.05);
  --accent:#6CC6BE; --accent-ink:#8FD8D0; --accent-soft:rgba(108,198,190,.14); --accent-glow:rgba(108,198,190,.45);
  --warm:#E2835C; --warm-ink:#F2A17B; --warm-soft:rgba(226,131,92,.16);
  --green:#8FCB88; --amber:#E0C46A; --gold:#E8C57A; --teal:#6CC6BE;
  --t-sleep:linear-gradient(150deg,#1A2A34 0%,#131A1F 100%); --g-sleep:rgba(110,150,220,.22);
  --t-hrv:linear-gradient(150deg,#162B27 0%,#121A19 100%); --g-hrv:rgba(108,198,190,.20);
  --t-energy:linear-gradient(150deg,#2A2A1B 0%,#17191A 100%); --g-energy:rgba(224,196,106,.18);
  --t-warm:linear-gradient(150deg,#2F211C 0%,#181617 100%); --g-warm:rgba(226,131,92,.20);
  --t-neutral:linear-gradient(150deg,#1B2126 0%,#14181B 100%); --g-neutral:rgba(108,198,190,.10);
  --card-edge:rgba(255,255,255,.05); --chip-bg:rgba(255,255,255,.05);
  --g-exc-fg:#8FD8D0; --g-exc-bg:rgba(108,198,190,.14);
  --g-normal-fg:#B3ADA3; --g-normal-bg:rgba(241,238,231,.06);
  --g-watch-fg:#F2A17B; --g-watch-bg:rgba(226,131,92,.18);
  --g-out-fg:#D97862; --g-out-bg:rgba(217,120,98,.18);
  --shadow-float:0 14px 40px rgba(0,0,0,.5); --shadow-frame:0 30px 90px rgba(0,0,0,.55);
  /* плоские карточки тёмной темы — слито из отдельного блока (аудит Qwen P6), значения те же */
  --card:#1A1F22;--card-sh:0 0 0 1px rgba(255,255,255,.045);--amber-soft:rgba(224,196,106,.14);
  --t-sleep:var(--card);--t-hrv:var(--card);--t-energy:var(--card);--t-warm:var(--card);--t-neutral:var(--card);
  --g-sleep:transparent;--g-hrv:transparent;--g-energy:transparent;--g-warm:transparent;--g-neutral:transparent;--card-edge:transparent;
  --g-watch-fg:#E0C46A;--g-watch-bg:rgba(224,196,106,.14)
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;display:grid;place-items:center;transition:background .4s ease,color .4s ease}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:640px) and (min-height:720px){
  body{background:light-dark(#EAE8E3,#08090A)}
  :root[data-theme="dark"] body{background:#08090A}
  #app{width:410px;height:min(880px,calc(100% - 48px));border-radius:32px;box-shadow:var(--shadow-frame);border:1px solid var(--line)}
}
#controls{position:fixed;left:24px;top:24px;z-index:50;display:none;flex-direction:column;align-items:flex-start;gap:8px}
@media (min-width:900px) and (min-height:720px){#controls{display:flex}}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);transition:border-color .3s ease,color .3s ease}
.pill:hover{border-color:var(--faint)}
.pill svg{width:14px;height:14px;color:var(--muted)}

/* atoms */
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.press{transition:scale .35s var(--ease)}
.press.down{scale:.98}
/* boot-скелетон, error-state, offline-баннер, мобильная тема (аудит Qwen P1/P3/P5) */
.skel{position:relative;overflow:hidden;background:var(--line-soft)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--surface-hi),transparent);animation:skel 1.6s ease infinite}
@keyframes skel{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}
#bootSkel{margin-top:6px}
#bootSkel[hidden],#bootErr[hidden],#netBan[hidden]{display:none}
#bootErr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:70px 24px 0}
#bootErr .beIc{width:44px;height:44px;color:var(--warm);margin-bottom:4px}
#bootErr h2{font-size:20px;font-weight:300;letter-spacing:-.01em}
#bootErr p{font-size:13.5px;color:var(--ink2);max-width:260px;line-height:1.5}
#bootRetry{margin-top:10px;min-height:44px;padding:0 26px;border-radius:22px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600}
#netBan{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:60;padding:9px 14px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-float)}
.hright{display:flex;align-items:center;gap:8px}
.tbTheme{display:none;flex:none;width:36px;height:36px;border-radius:18px;background:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);place-items:center}
.tbTheme svg{width:16px;height:16px;color:var(--ink2)}
@media (max-width:899px),(max-height:719px){.tbTheme{display:grid}}
#s-today.booting .chips,#s-today.booting .hero,#s-today.booting #needYou{display:none}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:500;letter-spacing:.01em;white-space:nowrap;background:var(--line-soft);color:var(--ink2)}
.grade{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:500;white-space:nowrap}
.grade.g-exc{color:var(--g-exc-fg);background:var(--g-exc-bg)}
.grade.g-normal{color:var(--g-normal-fg);background:var(--g-normal-bg)}
.grade.g-watch{color:var(--g-watch-fg);background:var(--g-watch-bg)}
.grade.g-out{color:var(--g-out-fg);background:var(--g-out-bg)}
.sectionHead{display:flex;justify-content:space-between;align-items:baseline;margin:30px 2px 12px;gap:10px}
.sectionHead h2{font-size:20px;font-weight:300;letter-spacing:-.01em}
.sectionHead span{font-size:12px;color:var(--muted)}
.linkline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent-ink);font-weight:500}
.linkline svg{width:13px;height:13px}
.flatRow{border-top:1px solid var(--line);padding:13px 0}
.flatRow:first-child{border-top:0}

/* stage & tabs */
.stage{position:absolute;inset:0;z-index:1;transition:transform .5s var(--spring)}
.stage.behind{transform:scale(.95) translateY(6px)}
.tab{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;pointer-events:none;opacity:0;transform:translateX(calc(var(--dir,1)*-28px));transition:transform .38s var(--ease),opacity .22s ease,visibility 0s .38s}
.tab.on{visibility:visible;pointer-events:auto;opacity:1;transform:none;transition:transform .42s var(--spring),opacity .32s ease .06s,visibility 0s 0s}
.tab.from{transform:translateX(calc(var(--dir,1)*36px));transition:none}
.rise{opacity:0;transform:translateY(10px);transition:opacity .18s ease,transform .3s ease}
.on .rise.in,.ov.open .rise{opacity:1;transform:none;transition:opacity .5s var(--ease) calc(var(--i,0)*60ms + 40ms),transform .6s var(--ease) calc(var(--i,0)*60ms + 40ms)}

.topbar{flex:none;padding:16px 20px 0;display:flex;justify-content:center}
.switcher{position:relative;display:flex;gap:10px}
.switcher button{position:relative;width:78px;height:32px;font-size:13px;font-weight:500;color:var(--muted);transition:color .3s ease;text-align:center}
.switcher button.on{color:var(--ink)}
.pager{flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
.track{display:flex;width:200%;height:100%;transition:transform .5s var(--spring);will-change:transform}
.screen{height:100%;overflow-y:auto;overflow-x:hidden;padding:0 20px 112px;scrollbar-width:none;overscroll-behavior-y:contain}
.screen::-webkit-scrollbar{display:none}
.track .screen{width:50%}
#track{width:100%;transform:none!important}
#track .screen{width:100%}
#todayTab .topbar{position:absolute;left:0;right:0;top:0;height:0;padding:0}
#s-today{padding-top:14px}
.tab>.screen{flex:1;min-height:0;padding-top:20px}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:live 3.2s ease-in-out infinite}
.dot-live.gray{background:var(--faint);animation:none}
@keyframes live{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 0 6px transparent}}
.title{font-size:28px;font-weight:300;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:center;gap:10px}
.subtitle{font-size:13px;color:var(--muted);margin-top:6px}

/* HERO — Oura-подача: фото на весь верх, дуга над числом */
#todayTab .topbar,#todayTab .pager{position:relative;z-index:1}
#todayTab .topbar{z-index:2}
#todayTab .topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:78px;pointer-events:none;opacity:0;transition:opacity .35s ease;background:linear-gradient(to bottom,var(--bg) 35%,transparent)}
#todayTab.photo:not(.rh) .topbar::before{background:linear-gradient(to bottom,rgba(6,18,34,.78) 30%,transparent)}
#todayTab.scrolled .topbar::before{opacity:1}
#todayTab .switcher{position:relative}
.todayBg{position:absolute;left:0;right:0;top:0;height:var(--bgH,64%);z-index:0;pointer-events:none;will-change:transform,opacity}
.tbGlow{position:absolute;inset:0 0 -30% 0;opacity:1;transition:opacity .6s ease;

.chips{display:flex;justify-content:center;gap:clamp(10px,4vw,20px);margin:12px 0 0;padding:4px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:scale .35s var(--ease)}
.chipC{position:relative;width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chipC .ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg);overflow:visible;filter:drop-shadow(0 0 3px var(--accent-glow))}
.chipC .ring circle{fill:none;stroke:var(--cc,var(--faint));stroke-width:1.8;stroke-linecap:round;stroke-dasharray:0 200;transition:stroke-dasharray 1.4s var(--ease)}
.chipI{width:12px;height:12px;color:var(--ink2)}
.chip.ok{--cc:var(--green)}.chip.low{--cc:var(--amber)}
.chip.ok .chipC{background:color-mix(in srgb,var(--green) 14%,var(--chip-bg))}
.chip.low .chipC{background:color-mix(in srgb,var(--amber) 10%,var(--chip-bg))}
.chip.ok .chipC .ring{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--green) 55%,transparent))}
.chip.ok .chipI{color:var(--green)}.chip.low .chipI{color:var(--amber)}
#todayTab.photo .chip.ok{--cc:#9EE6A0}#todayTab.photo .chip.low{--cc:#F0D27A}
#todayTab.photo .chip.ok .chipI{color:#9EE6A0}#todayTab.photo .chip.low .chipI{color:#F0D27A}
.chipI.gold{color:var(--gold)}
.chipV{font-size:16px;font-weight:400;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.chipV small{font-size:11px;color:var(--muted);margin-left:1px}
.chipL{font-size:12px;color:var(--ink2);white-space:nowrap}

/* hero */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;padding:clamp(4px,1.4vh,14px) 0 6px;text-align:center}
/* дуга индекса дня: пологий сегмент над числом, своя строка — ничего не перекрывает */
.arcBox{position:relative;width:min(300px,82vw)}
.arcSvg{width:100%;height:auto;overflow:visible;display:block}
.arcTrack{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round}
.arcTrack.empty{stroke-dasharray:.5 5}
.arcAhead{fill:none;stroke:var(--arc,var(--accent));stroke-width:2;stroke-linecap:round;opacity:.28}
.arcVal{fill:none;stroke:var(--arc,var(--accent));stroke-width:2.4;stroke-linecap:round}
.arcGlowP{fill:none;stroke:var(--arc,var(--accent));stroke-width:7;stroke-linecap:round;opacity:.5}
.arcTick{fill:var(--muted);opacity:.3}
.arcSvg.live .arcTick{animation:tick 3.4s ease-in-out infinite;animation-delay:calc(var(--k)*.2s)}
.arcSvg.live .arcTick.in{fill:var(--arc,var(--accent))}
@keyframes tick{0%,100%{opacity:.22}35%{opacity:1}60%{opacity:.4}}
.arcEnd{font-size:11px;fill:var(--muted);font-family:var(--font);letter-spacing:.04em}
.arcDotG{opacity:0;transition:opacity .3s ease}
.arcDotG.on{opacity:1}
.arcDot{fill:var(--bg);stroke:var(--arc,var(--accent));stroke-width:2}
#todayTab.photo .arcDot{fill:#0d2236}
.arcHalo{fill:var(--arc,var(--accent));transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.arcIcons{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;align-items:center;gap:8px;height:20px}
.arcIcons .ic{width:17px;height:17px;color:var(--ink2)}
.crown{display:none;width:17px;height:17px;color:var(--gold);opacity:0;transform:scale(.3) translateY(6px) rotate(-10deg);transition:opacity .7s var(--ease),transform .9s var(--spring),filter .7s ease}
.crown.has{display:block}
.crown.show{opacity:1;transform:none;filter:drop-shadow(0 0 6px rgba(240,207,134,.7))}
.crown svg{width:17px;height:17px}
.bioBig{margin-top:2px;font-size:clamp(56px,8.6vh,68px);font-weight:300;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
#todayTab.photo .bioBig{text-shadow:0 2px 30px rgba(4,12,24,.35)}
#todayTab.photo .bioSub,#todayTab.photo .hero p,#todayTab.photo .chipL,#todayTab.photo .hdr{text-shadow:0 1px 14px rgba(4,12,24,.6),0 0 3px rgba(4,12,24,.55)}
.bioSub{margin-top:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.bioSub b{color:var(--ink);font-weight:600}
.emo{margin-top:clamp(12px,2vh,18px);font-family:var(--serif);font-size:clamp(27px,3.9vh,32px);font-weight:300;line-height:1.1;letter-spacing:-.01em;color:var(--ink);max-width:320px;text-wrap:balance}
.effect{margin-top:16px;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 14px;border-radius:17px;font-size:12.5px;color:var(--ink2);background:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.effect b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.effect svg{width:13px;height:13px;color:var(--muted)}
.effect.none{box-shadow:none;background:none;color:var(--muted)}
.hdr .status{cursor:pointer}
.dnav{display:flex;align-items:center;gap:4px;margin-left:-8px}
#tDate{white-space:nowrap}.hdr .status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dArr{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.dArr svg{width:15px;height:15px}
.dArr[hidden]{display:none}
.idxBtn{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pastTag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--chip-bg);color:var(--ink2)}
.evmore{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:8px;padding:10px 14px;border-radius:16px;font-size:12.5px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.evmore b{font-weight:600;color:var(--ink)}
.evmore svg{width:13px;height:13px;color:var(--muted);transition:transform .3s var(--ease)}
.evmore.open svg{transform:rotate(90deg)}
.bcard.gold{--tint:var(--t-energy);--glow:rgba(232,197,122,.3)}
.bcard.green{--tint:var(--t-hrv);--glow:rgba(143,203,136,.28)}
.stw.gold{color:var(--gold)}.stw.green{color:var(--green)}
.idxRow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.idxRow:first-child{border-top:0}
.idxRow i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.idxRow i svg{width:12px;height:12px;stroke-width:2.4;color:#fff}
.idxRow i.y{background:color-mix(in srgb,var(--green) 16%,transparent)}.idxRow i.y svg{color:var(--green)}.idxRow i.w{background:var(--amber)}.idxRow i.n{background:var(--warm)}.idxRow i.o{box-shadow:inset 0 0 0 1.4px var(--faint)}
.idxRow span{flex:1;font-size:14px}
.idxRow span small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.idxRow em{font-style:normal;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.idxRow em.n{color:var(--warm-ink)}.idxRow em.w{color:var(--amber)}

/* cards — тонированные поверхности */
.cards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cards:empty{display:none}
.mcard{position:relative;display:block;width:100%;border-radius:24px;padding:15px 16px 16px;background:var(--tint,var(--t-neutral));overflow:hidden;isolation:isolate;text-align:left;box-shadow:inset 0 0 0 1px var(--card-edge);transition:scale .35s var(--ease)}
.mcard::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 120% at 100% 0%,var(--glow,var(--g-neutral)) 0%,transparent 60%);animation:cardglow 7s ease-in-out infinite alternate}
@keyframes cardglow{from{opacity:.65}to{opacity:1}}
.mcard.sleep{--tint:var(--t-sleep);--glow:var(--g-sleep)}
.mcard.hrv{--tint:var(--t-hrv);--glow:var(--g-hrv)}
.mcard.energy{--tint:var(--t-energy);--glow:var(--g-energy)}
.mcard.warm{--tint:var(--t-warm);--glow:var(--g-warm)}
.mc-h{display:flex;align-items:center;gap:11px}
.mc-ic{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--line-soft)}
.mc-ic svg{width:16px;height:16px;color:var(--ink2)}
.mc-t{flex:1;min-width:0}
.mc-t b{display:block;font-size:14.5px;font-weight:500;color:var(--ink)}
.stw{display:block;margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.stw.teal{color:var(--teal)}.stw.green{color:var(--green)}.stw.amber{color:var(--amber)}.stw.warm{color:var(--warm)}
.mc-go{flex:none;width:15px;height:15px;color:var(--muted)}
.ncard .mc-h{align-items:flex-start}
/* секции главной: у каждой своя задача, пустая — не рендерится */
.sec{margin-top:26px}
.sec:first-of-type{margin-top:28px}
.secH{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 4px 10px}
.secH>span:last-child{font-size:11.5px;color:var(--muted);text-align:right}
#needYou .mcard{margin-top:0}
#needYou .secH{margin-top:4px}
/* брифинг: заметили → почему → что сделать; ≤4 карточек, каждая со смыслом */
.brief{display:flex;flex-direction:column;gap:10px}
.bcard{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 14px 14px 14px;border-radius:22px;background:var(--tint,var(--t-neutral));box-shadow:inset 0 0 0 1px var(--card-edge);overflow:hidden;isolation:isolate;text-align:left}
.bcard::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 120% at 100% 0%,var(--glow,var(--g-neutral)) 0%,transparent 60%)}
.bcard.teal{--tint:var(--t-hrv);--glow:var(--g-hrv)}.bcard.warm{--tint:var(--t-warm);--glow:var(--g-warm)}.bcard.amber{--tint:var(--t-energy);--glow:var(--g-energy)}.bcard.sleep{--tint:var(--t-sleep);--glow:var(--g-sleep)}
.bcard .mc-ic{margin-top:1px}
.bbody{flex:1;min-width:0}
.bbody .stw{margin:0 0 5px}
.bbody b{display:block;font-size:14.5px;font-weight:500;line-height:1.4;color:var(--ink)}
.bbody small{display:block;margin-top:4px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.bbody .hyp{display:inline-block;margin-left:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:600}
.bcard.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.quietL{display:flex;align-items:center;gap:8px;margin:2px 6px 0;font-size:12px;color:var(--muted)}
.quietL svg{width:13px;height:13px;color:var(--teal)}
/* главная подсказка + до двух строк; автоотметки вечером; «почему я так думаю» */
.bmain{padding:16px}
.bmain .bbody b{font-size:16px;line-height:1.38}
.whyL{display:inline-flex;align-items:center;gap:4px;min-height:40px;margin-top:2px;font-size:12px;color:var(--muted)}
.whyL svg{width:12px;height:12px}
.brows{margin-top:6px}
.brow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 6px;border-top:1px solid var(--line-soft);text-align:left}
.brow:first-child{border-top:0}
.brow>svg{flex:none;width:16px;height:16px;color:var(--muted)}
.brow .bt{flex:1;min-width:0;font-size:14px;line-height:1.4;color:var(--ink);text-align:left;min-height:24px}
.brow .bt .hyp{margin-left:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:600}
.brow .bx{flex:none;font-size:12px;font-weight:600;color:var(--accent-ink)}
.brow .bx.on{color:var(--green)}
.chkl{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.chkl div{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink)}
.chkl i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.4px var(--faint)}
.chkl i.y{background:var(--green);box-shadow:0 0 8px color-mix(in srgb,var(--green) 50%,transparent)}
.chkl i svg{width:11px;height:11px;color:#fff;stroke-width:2.4}
.chkl span small{color:var(--muted);margin-left:6px;font-size:12px}
.chkl button{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-ink)}
.wkBig{margin-top:8px;font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.wkBig small{font-size:14px;color:var(--muted);margin-left:6px;letter-spacing:0}
/* идёт проверка — строка с прогрессом */
.checks{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ckrow{display:block;width:100%;padding:12px 14px;border-radius:18px;background:var(--t-neutral);box-shadow:inset 0 0 0 1px var(--card-edge);text-align:left}
.ck-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink)}
.ck-h span:first-child{min-width:0}
.ck-h .stw{display:inline;margin:0 8px 0 0}
.ck-h span:last-child{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ckbar{position:relative;height:3px;border-radius:3px;background:var(--line);margin-top:9px;overflow:visible}
.ckbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent-ink) 45%,#fff 50%,var(--accent-ink) 55%,var(--accent) 100%);background-size:250% 100%;animation:shimmer 3.2s linear infinite;box-shadow:0 0 10px var(--accent-glow)}
.ckbar i::after{content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent);animation:scanbeat 1.8s ease-out infinite}
.ck-m{margin-top:7px;font-size:12px;color:var(--muted)}
/* серии — один ряд значков, детали по тапу */
.strow{display:block;width:100%;padding:12px 6px 4px;border-top:1px solid var(--line);text-align:left}
.strow-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.strow-h svg{width:14px;height:14px;color:var(--muted)}
.strow-i{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sti{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sti svg{width:16px;height:16px;color:var(--ink2)}
.sti b{font-size:20px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.sti span{font-size:11px;line-height:1.25;color:var(--muted);white-space:nowrap}
.sti.best b,.sti.best svg{color:var(--gold)}
.sti.pause{opacity:.45}
.sti.pause span{color:var(--amber)}
.sti .fzs{height:12px;display:flex;align-items:center;gap:2px;font-size:11px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.sti .fzs svg{width:9px;height:9px;color:var(--accent-ink)}
.stlist .reason small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
/* назначения врача — недельная сетка, не серия */
.mcard.rx{padding:12px 14px 6px}
.rxHead,.rxRow{display:grid;grid-template-columns:1fr repeat(7,16px) 34px;align-items:center;column-gap:5px}
.rxHead span{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em}
.rxHead span.today{color:var(--teal);font-weight:700}
.rxRow{padding:10px 0;border-top:1px solid var(--line-soft)}
.rxHead+.rxRow{border-top:0}
.rxT{min-width:0}
.rxT b{display:block;font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxT small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.rxD{width:14px;height:14px;margin:0 auto;border-radius:50%;box-shadow:inset 0 0 0 1.3px var(--faint);transform:scale(.4);opacity:0;transition:transform .6s var(--spring),opacity .4s ease;transition-delay:calc(var(--k)*50ms + 200ms)}
.rx.go .rxD{transform:none;opacity:1}
.rxD.y{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.rxD.f{box-shadow:inset 0 0 0 1.3px var(--line);opacity:.5}
.rx.go .rxD.f{opacity:.5}
.rxD.q{box-shadow:inset 0 0 0 1.3px var(--faint);background:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 4px)}
.rxD.t{box-shadow:inset 0 0 0 1.5px var(--teal)}
.rxD.tap{position:relative;cursor:pointer}
.rxD.tap::before{content:"";position:absolute;inset:-14px}
.rxD.m{background:var(--accent);opacity:.85;outline:1.5px dashed var(--accent);outline-offset:2px;box-shadow:none}
.rxNote{margin:4px 0 6px;font-size:11px;color:var(--muted)}
.rxN{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rxN.ok{color:var(--green);font-weight:600}
/* серии: пауза при отсутствии данных, заморозки, режим поездки */
.tripBtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink2);margin-right:-4px;flex:none}
.tripBtn svg{width:19px;height:19px}
.tripBtn.on{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.tripBox{margin-top:16px;border-radius:20px;background:var(--card);box-shadow:var(--card-sh);padding:14px 16px}
.tripBox.on{background:var(--amber-soft);box-shadow:none}
.tripBox b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.tripBox small{display:block;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.tripBox .tripAct{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tripBox .tripAct button{min-height:36px;padding:0 14px;border-radius:18px;background:var(--line-soft);font-size:13px;font-weight:600;color:var(--accent-ink)}
.tripBox.on .tripAct button{background:transparent;box-shadow:inset 0 0 0 1px var(--amber);color:var(--amber)}
.tTrip[hidden]{display:none}
.tTrip{display:block;margin-top:1px;font-size:12px;color:var(--ink2);opacity:.8;white-space:nowrap}
.stk .fz{position:absolute;top:12px;right:12px;display:flex;gap:2px;color:var(--accent-ink)}
.stk .fz svg{width:11px;height:11px}
.stk.pause{opacity:.72}
.stk.pause .sm{color:var(--amber);font-weight:600}
.fzNote{margin:10px 6px 0;font-size:11.5px;line-height:1.5;color:var(--muted)}
/* фокус дня — 1–3 действия, отметка = action-ack */
.mcard.focus{padding:4px 14px}
.fitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.fitem:first-child{border-top:0}
.fchk{flex:none;position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--faint);transition:background .35s var(--ease),box-shadow .35s var(--ease),scale .35s var(--spring)}
.fchk svg{width:14px;height:14px;color:#fff;stroke-width:2.2;opacity:0;transform:scale(.4);transition:opacity .25s ease,transform .45s var(--spring)}
.fitem.done .fchk{background:var(--accent);box-shadow:0 0 0 0 transparent,0 0 14px var(--accent-glow)}
.fitem.done .fchk svg{opacity:1;transform:none}
.fitem.pop .fchk{animation:chkpop .6s var(--spring)}
@keyframes chkpop{0%{scale:1}40%{scale:1.25}100%{scale:1}}
.ftxt{flex:1;min-width:0;text-align:left}
.ftxt b{display:block;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.35;transition:color .3s ease}
.ftxt small{display:block;margin-top:3px;font-size:12px;color:var(--muted);line-height:1.35}
.ftxt .ft{color:var(--teal);font-weight:600;letter-spacing:.06em;margin-right:6px;font-variant-numeric:tabular-nums}
.fitem.done .ftxt b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.fic{flex:none;width:16px;height:16px;color:var(--muted)}
/* серии */
.streaks{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none;touch-action:pan-x pan-y;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.streaks::-webkit-scrollbar{display:none}
.stk{flex:none;position:relative;width:118px;padding:13px 13px 12px;border-radius:20px;background:var(--t-neutral);box-shadow:inset 0 0 0 1px var(--card-edge);overflow:hidden;isolation:isolate}
.stk::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 90% at 100% 0%,var(--g-hrv),transparent 60%)}
.stk.best::before{background:radial-gradient(90% 90% at 100% 0%,rgba(232,197,122,.28),transparent 62%)}
.stk .si{width:15px;height:15px;color:var(--ink2)}
.stk .sn{white-space:nowrap;margin-top:10px;font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stk .sn small{font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:0}
.stk .sl2{margin-top:4px;font-size:12px;line-height:1.3;color:var(--ink2);min-height:31px}
.stk .sr{margin-top:8px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.stk .sr i{display:block;height:100%;width:0;border-radius:2px;background:var(--accent);transition:width 1.2s var(--ease) .2s}
.stk .sm{margin-top:5px;font-size:11px;color:var(--muted)}
.stk.best .sm{color:var(--gold);font-weight:600}
.stk.best .sr i{background:var(--gold)}
/* что изменилось */
.mcard.issue{padding:6px 14px}
.irow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--ink);text-align:left;width:100%}
.irow:first-child{border-top:0}
.irow svg{flex:none;width:14px;height:14px}
.irow .up{color:var(--green)}
.irow.quiet{color:var(--muted);font-size:12.5px}
.irow.quiet svg{color:var(--teal)}
.irow .mc-go{margin-left:auto}
/* нужен ты */
.nrow{display:flex;align-items:flex-start;gap:10px;padding:11px 0 2px;border-top:1px solid var(--line-soft);text-align:left;width:100%}
.nrow+.nrow{margin-top:8px}
.nrow .nt{font-size:14px;line-height:1.45;color:var(--ink)}
.nacts{display:flex;flex-wrap:wrap;gap:0 16px;margin-top:2px}
.nacts button{white-space:nowrap}
.nacts button{min-height:40px}
.nacts button{font-size:12.5px;font-weight:600;color:var(--accent-ink)}
.nacts button.m{color:var(--muted);font-weight:500}
/* разбор вклада дня (overlay) */
.efrow{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.efrow:first-child{border-top:0}
.efd{flex:none;width:64px;text-align:right;font-size:19px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.efd.good{color:var(--teal)}.efd.bad{color:var(--warm)}.efd.zero{color:var(--muted)}
.efm{flex:1;min-width:0}
.efm b{display:block;font-size:14px;font-weight:500}
.efm span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.efm .efs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.efb{height:4px;border-radius:2px;background:var(--line-soft);margin-top:8px;overflow:hidden}
.efb i{display:block;height:100%;border-radius:2px;background:var(--faint)}
.efb i.good{background:var(--teal)}.efb i.bad{background:var(--warm)}
.efbar{position:relative;height:6px;margin:18px 0 6px;border-radius:3px;background:var(--line-soft)}
.efbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.disc{margin-top:18px;font-size:12px;line-height:1.5;color:var(--muted)}
.reason{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.reason:first-child{border-top:0}
.reason span:last-child{font-variant-numeric:tabular-nums}
.ncard .nt{flex:1;font-size:14px;line-height:1.45;color:var(--ink)}
.ncard .nt .stw{margin:0 0 5px}
.pdot2{flex:none;position:relative;width:8px;height:8px;margin:5px 4px 0;border-radius:50%;background:var(--warm)}
.pdot2::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--warm);animation:beacon 2.2s ease-out infinite}
.pdot2.teal,.pdot2.teal::after{background:var(--accent)}
@keyframes beacon{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}
.thinrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 2px;border-top:1px solid var(--line);text-align:left}
.trTime{flex:none;width:42px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.trDot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.trText{flex:1;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.trText b{color:var(--ink);font-weight:500}
.trText small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.trGo{flex:none;width:14px;height:14px;color:var(--faint)}

/* RHYTHM */
.medchip{height:21px;font-size:11px}
.chartcard{margin-top:6px;padding-top:6px}
.steps-h{font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.steps-h span{font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.steps-h.nod{font-size:28px;color:var(--faint);font-weight:200}
.togo{margin-top:6px;font-size:13px;color:var(--muted)}
.togo b{font-weight:600;color:var(--accent-ink)}
.chart{margin-top:14px;width:100%;height:auto;overflow:visible}
.xl{font-size:11px;fill:var(--muted);font-family:var(--font);letter-spacing:.04em}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.go .draw{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s var(--ease) .1s}
.area,.fadein{opacity:0}
.go .area{opacity:1;transition:opacity 1.2s ease .6s}
.go .fadein{opacity:1;transition:opacity .9s ease 1s}
.pdot{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3)}
.go .pdot{opacity:1;transform:scale(1);transition:opacity .5s ease 1.4s,transform .7s var(--spring) 1.4s}
.emptychart{position:relative}
.emptychart p{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);text-align:center;padding:0 30px}
.levers{margin-top:6px}
.lever{border-top:1px solid var(--line);padding:14px 0}
.lever:first-child{border-top:0}
.lever-h{width:100%;display:block}
.lever-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lever-name{font-size:14px;color:var(--ink)}
.lever-name b{font-weight:500}
.lever-name span{color:var(--muted);margin-left:6px;font-size:13px}
.lever-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-ink);font-weight:500;white-space:nowrap}
.lever-meta .wm{font-style:normal;color:var(--warm-ink)}
.lever.nodata .lever-meta{color:var(--muted);font-weight:400}
.chev{width:13px;height:13px;color:var(--faint);transition:transform .4s var(--ease)}
.lever.open .chev{transform:rotate(180deg)}
.bar{position:relative;height:3px;border-radius:3px;background:var(--line-soft);margin-top:12px}
.lever.nodata .bar{background:none;border-top:1.5px dashed var(--faint);height:0;margin-top:14px}
.zone{position:absolute;top:-3px;bottom:-3px;border-radius:4px;background:var(--line)}
.tick{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--accent-ink);opacity:.6}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--accent);transition:width 1.1s var(--ease)}
.lever-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.lever.open .lever-more{grid-template-rows:1fr}
.lever-more>div{overflow:hidden}
.srcs{padding:12px 0 2px;opacity:0;transform:translateY(-4px);transition:opacity .3s ease,transform .4s var(--ease)}
.lever.open .srcs{opacity:1;transform:none;transition:opacity .4s ease .1s,transform .5s var(--ease) .08s}
.src{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:var(--ink2)}
.src svg{width:15px;height:15px;color:var(--muted);flex:none}
.src .sb{flex:1;height:3px;border-radius:3px;background:var(--line-soft);position:relative}
.src .sb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink2);opacity:.5}
.src .g{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.src-note{margin-top:8px;font-size:13px;color:var(--accent-ink);font-weight:500}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:stretch}
/* плитка = столбец: подпись фиксированной высоты, число, «из N», полоска внизу; div и button выглядят одинаково
   (button по умолчанию центрирует содержимое по вертикали — из-за этого «Белки» стояли ниже соседей) */
.mac{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;min-width:0;text-align:left;padding:11px 10px 10px;border-radius:16px;background:var(--t-neutral);box-shadow:inset 0 0 0 1px var(--card-edge)}
.mac .lbl{display:flex;align-items:center;gap:3px;height:16px;white-space:nowrap;font-size:11px}
.mac b{display:block;margin-top:6px;font-size:18px;line-height:1.15;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mac span.of{display:block;font-size:11px;white-space:nowrap;color:var(--muted);margin-top:1px;margin-bottom:8px}
.mac .mb{width:100%;height:2px;border-radius:2px;background:var(--line);margin-top:auto;overflow:hidden}
.mac .mb i{display:block;height:100%;border-radius:2px;background:var(--accent);width:0;transition:width 1.1s var(--ease) .2s}
.mac.tapm{cursor:pointer}
.mac .mchev{width:10px;height:10px;color:var(--muted);transition:transform .3s var(--ease)}
.mac.tapm.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.mac.tapm.on .mchev{transform:rotate(180deg)}
.psrc{margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--t-neutral);box-shadow:inset 0 0 0 1px var(--card-edge)}
.macros .empty{grid-column:1/-1;font-size:13px;color:var(--muted);padding:6px 2px}
.micro .mrow2{padding:12px 0;border-top:1px solid var(--line)}
.micro .mrow2:first-child{border-top:0}
.mr-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.mr-h span:last-child{font-variant-numeric:tabular-nums;color:var(--warm-ink);font-size:13px}
.mr-b{height:3px;border-radius:3px;background:var(--line-soft);margin-top:8px;position:relative;overflow:hidden}
.mr-b i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--warm);opacity:.8}
.mr-a{margin-top:8px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.mr-a b{color:var(--accent-ink);font-weight:600}
.mr-ok{padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mr-ok svg{width:13px;height:13px;color:var(--teal)}
.foot{margin-top:20px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.5}

/* PLAN */
.tl{margin-top:20px}
.tl-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{padding:10px 8px 9px;border-top:2px solid var(--line);text-align:left;opacity:.5;transition:opacity .35s ease,border-color .35s ease}
.pc.sel{opacity:1;border-color:var(--accent)}
.pc .d{font-size:16px;font-weight:400;letter-spacing:-.01em}
.pc .n{font-size:11px;color:var(--muted);margin-top:3px}
.pc .w{font-size:11px;color:var(--accent-ink);margin-top:6px;font-weight:500}
.tl-line{position:relative;height:30px;margin-top:8px}
.tl-line .ln{position:absolute;left:0;right:0;top:6px;height:1.5px;background:var(--line);border-radius:2px}
.node{position:absolute;top:2px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--bg);border:1.5px solid var(--faint);transition:transform .4s var(--spring),border-color .3s ease,background .3s ease}
.node.sel{transform:scale(1.3);background:var(--accent);border-color:var(--accent)}
.node.now{width:6px;height:6px;margin-left:0;top:4px;border:0;background:var(--ink2)}
.mo{position:absolute;top:16px;font-size:11px;color:var(--faint);letter-spacing:.06em;transform:translateX(-50%)}
.panel{margin-top:20px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline}
.panel-h h2{font-size:20px;font-weight:400;letter-spacing:-.01em}
.panel-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.plist{transition:opacity .2s ease,transform .3s ease}
.plist.swap{opacity:0;transform:translateY(6px)}
.nextDraw{margin-top:18px;padding:18px 16px 16px;border-radius:24px;background:var(--t-hrv);box-shadow:inset 0 0 0 1px var(--card-edge);position:relative;overflow:hidden;isolation:isolate}
.nextDraw::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 120% at 100% 0%,var(--g-hrv),transparent 60%)}
.nd-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nd-d{margin-top:8px;font-family:var(--serif);font-size:32px;font-weight:300;line-height:1.05}
.nd-m{margin-top:6px;font-size:13px;color:var(--ink2)}
.nd-m b{font-weight:600;color:var(--ink)}
.nd-w{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.nd-w div{display:flex;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.4}
.nd-w div b{flex:none;font-weight:600;color:var(--ink)}
.nd-w div span{color:var(--ink2)}
.nd-w div em{flex:none;margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nd-q{margin-top:12px;padding:11px 12px;border-radius:14px;background:var(--warm-soft);font-size:13px;line-height:1.4;color:var(--ink)}
.nd-q .nacts{display:flex;margin-top:2px}
.ost{flex:none;font-size:12px;text-align:right;max-width:40%}
.ost.y{color:var(--green)}.ost.w{color:var(--amber)}.ost.o{color:var(--muted)}
.nd-n{display:flex;gap:7px;align-items:flex-start;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:12.5px;line-height:1.45;color:var(--ink2)}
.nd-n svg{flex:none;width:13px;height:13px;color:var(--teal);margin-top:2px}
.dates{display:flex;align-items:center;gap:6px;margin:14px 2px 0;font-size:12px;color:var(--muted);overflow-x:auto;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates>span{flex:none;white-space:nowrap}
.dpill{flex:none;white-space:nowrap;height:30px;padding:0 11px;border-radius:15px;font-size:12.5px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.dpill.on{background:var(--ink);color:var(--bg);box-shadow:none}
.acc{margin-top:20px}
.accS{display:block;width:100%;border-top:1px solid var(--line);text-align:left}
.accH{width:100%;display:flex;align-items:center;gap:10px;padding:15px 2px}
.accT{flex:1;min-width:0}
.accT b{display:block;font-size:15px;font-weight:500;color:var(--ink)}
.accT small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.adot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warm);box-shadow:0 0 8px var(--g-warm);transform:scale(0);transition:transform .4s var(--spring)}
.adot.on{transform:scale(1)}
.accB{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.accS.open .accB{grid-template-rows:1fr}
.accS.open .accH .chev{transform:rotate(180deg)}
.accB>div{overflow:hidden}
.accS.open .accB>div{padding-bottom:14px}
.grp{margin-top:18px}
.grp:first-child{margin-top:4px}
.gwhy{font-size:12.5px;color:var(--accent-ink);margin:-1px 0 4px}
.labSum{margin-top:14px;padding:14px;border-radius:20px;background:var(--t-neutral);box-shadow:inset 0 0 0 1px var(--card-edge)}
.ls-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ls-top b{display:block;font-size:26px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ls-top span{font-size:12px;color:var(--muted)}
.ls-r{text-align:right;display:flex;flex-direction:column;gap:2px}
.ls-labs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.lchip{height:30px;padding:0 11px;border-radius:15px;font-size:12px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.lchip em{font-style:normal;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.lchip.on{background:var(--accent);color:#fff;box-shadow:none}
.lchip.on em{color:rgba(255,255,255,.8)}
.ls-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.ls-row b{font-weight:600;font-variant-numeric:tabular-nums}
.ls-miss{margin-top:8px;font-size:12.5px;color:var(--warm-ink)}
.ls-note{margin-top:8px;font-size:11.5px;color:var(--muted)}
.ls-check{display:flex;gap:6px;align-items:flex-start;color:var(--ink2)}
.ls-check::before{content:"i";flex:none;width:14px;height:14px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.2px var(--muted);color:var(--muted);font-size:10px;font-weight:600;line-height:14px;text-align:center}
.ls-next{display:flex;gap:7px;align-items:flex-start;margin-top:12px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.ls-next svg{flex:none;width:13px;height:13px;color:var(--teal);margin-top:2px}
.grp .lbl{margin-bottom:4px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.grp .trow:first-of-type{border-top:0}
.trow .nm{font-size:14.5px}
.trow .why{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.trow .iv{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ferRow{margin-top:16px}
.ferActs{display:flex;gap:18px;margin-top:2px;padding-left:18px}
.textBtn{font-size:13px;font-weight:500;color:var(--accent-ink)}
.textBtn.muted{color:var(--muted)}
.cover{margin-top:24px;text-align:center}
.cover p{font-size:12.5px;color:var(--muted)}
.acts{display:flex;justify-content:center;gap:20px;margin-top:12px}
.actLink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.actLink svg{width:14px;height:14px;color:var(--muted)}
.concRow{margin-top:6px}
.prog{margin-top:6px}
.pr{border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 0}
.pr-h .pm{flex:1;min-width:0}
.pr-h .pm b{display:block;font-size:14.5px;font-weight:400}
.pr-h .pm span{display:block;font-size:12.5px;color:var(--accent-ink);margin-top:3px}
.pr-h .pw{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pr-h .src-tag{font-size:11px;margin-left:6px;height:17px;padding:0 7px;vertical-align:1px}
.pr .lever-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.pr.open .lever-more{grid-template-rows:1fr}
.pr.open .chev{transform:rotate(180deg)}
.pr .pd{padding:0 0 14px;opacity:0;transition:opacity .3s ease}
.pr.open .pd{opacity:1;transition:opacity .4s ease .1s}
.pd .kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:4px 0}
.pd .kv span:first-child{color:var(--muted)}
.pd .kv span:last-child{text-align:right;color:var(--ink2)}
.ptrack{height:3px;border-radius:3px;background:var(--line-soft);margin:6px 0 8px;overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.closedprog{margin-top:8px}
.cp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}

.docRow{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:14px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}

.mainActs{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:6px}

.ckI{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.4px var(--faint)}

.brow .bt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.mainWhy{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--ink2);max-width:320px}
.proof{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.pf-h{margin-top:8px;font-family:var(--serif);font-size:24px;font-weight:300;line-height:1.2}
.pf-cmp{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.pf-bar{display:grid;grid-template-columns:118px 1fr 50px;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}

.pf-s{margin-top:12px;font-size:13px;line-height:1.5;color:var(--ink2)}
.pf-next{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);font-size:13px;line-height:1.45;color:var(--ink)}

.ep{border-top:1px solid var(--line-soft)}

.case2{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

/* tab bar — плавающая капсула */
.tabbar{position:absolute;z-index:20;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom,0px));height:62px;display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px;border-radius:31px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line-soft);box-shadow:0 10px 30px rgba(29,27,24,.08);transition:transform .5s var(--spring)}

.pub:first-of-type{border-top:0}
.pub .pt{font-size:14px;line-height:1.4;color:var(--ink)}
.pub .pr2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.pub .pw2{font-size:12px;color:var(--muted)}
.pub .pl{margin-left:auto;font-size:12px;color:var(--accent-ink);font-weight:500;display:flex;align-items:center;gap:3px}
.pub .pl svg{width:12px;height:12px}
.tglink{margin:28px auto 0;display:flex;width:max-content}
.meals{display:flex;gap:10px;overflow-x:auto;margin:14px -20px 0;padding:4px 20px 12px;scrollbar-width:none}
.meals::-webkit-scrollbar{display:none}
.meal{flex:none;width:104px;padding:10px;border-radius:14px;border:1px solid var(--line)}
.meal .ph{width:100%;aspect-ratio:1.3;border-radius:10px;display:grid;place-items:center;background:var(--line-soft)}
.meal .ph svg{width:24px;height:24px;color:var(--ink2)}
.meal b{display:block;font-size:12.5px;font-weight:500;margin-top:9px;line-height:1.3}
.meal span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.week{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.dial{position:relative;text-align:center}
.dial svg{width:100%;max-width:150px;margin:0 auto;overflow:visible}
.dial .dv{position:absolute;left:0;right:0;top:36px;bottom:auto;font-size:32px;font-weight:200;letter-spacing:-.02em;line-height:1}
.dial .lbl{margin-top:8px}
.plants{border-left:1px solid var(--line);padding-left:16px}
.plants .pv{font-size:38px;font-weight:200;letter-spacing:-.02em;line-height:1}
.plants p{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.4}
.plants p b{font-weight:500;color:var(--accent-ink)}
.cl-list{margin-top:18px}
.cline{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.cline:first-child{border-top:0}
.cline .n{flex:none;width:18px;font-size:12px;color:var(--faint);padding-top:2px;font-variant-numeric:tabular-nums}
.cline p{flex:1;font-size:14px;line-height:1.45;color:var(--ink)}
.cline .mini{flex:none;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;font-size:11.5px;white-space:nowrap;border-radius:13px;color:var(--accent-ink);border:1px solid var(--line)}
.cline .mini svg{width:12px;height:12px;flex:none;stroke-width:2}
.cline .mini.ok{color:var(--green);border-color:transparent;padding:0 2px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.stile{padding:14px 12px 13px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:8px;transition:border-color .3s ease,scale .35s var(--ease)}
.stile.cur{border-color:var(--accent)}
.stile svg.mr{width:50px;height:50px}
.stile b{font-size:14px;font-weight:500}
.stile b span{font-weight:400;color:var(--muted);margin-left:5px;font-size:12px}
.stile small{font-size:11.5px;color:var(--muted);line-height:1.35}

/* pull-to-refresh (Vita v2, живая жалоба 2026-09-28: «по свайпу нет
   обновления приложения») — тянешь вниз от верха списка, отпускаешь после
   порога, перезагружаются данные текущей вкладки. */
.pullRefresh{position:absolute;z-index:15;top:14px;left:0;right:0;display:flex;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
.pullRefresh.show{opacity:1}
.prSpin{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);background:var(--bg);box-shadow:var(--shadow-float);animation:prspin .7s linear infinite}
@keyframes prspin{to{transform:rotate(360deg)}}

/* toast */
.toast{position:absolute;z-index:40;left:20px;right:20px;margin:0 auto;width:fit-content;bottom:94px;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-radius:16px;font-size:13px;color:var(--ink2);background:var(--ink);box-shadow:var(--shadow-float);transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .3s ease}
:root[data-theme="dark"] .toast{background:#F1EEE7}
.toast{color:var(--bg)}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 8px}
.toast span{line-height:1.4}

@media (max-height:700px){
  .coachline{font-size:12.5px}
  .metrics{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
/* ================= ДС v2 — по бенчмарку (п. 17 ПЛАНА СБОРКИ) =================
   один регистр (без КАПСа), плоские карточки без свечений, тон — только в иконке,
   коралл — только клиника, янтарь — «можно улучшить», одна строка списка, одна тёмная кнопка */
:root{--card:#FFFFFF;--card-sh:0 1px 2px rgba(29,27,24,.05),0 0 0 1px rgba(29,27,24,.035);--amber-soft:rgba(154,125,30,.13);
  --t-sleep:var(--card);--t-hrv:var(--card);--t-energy:var(--card);--t-warm:var(--card);--t-neutral:var(--card);
  --g-sleep:transparent;--g-hrv:transparent;--g-energy:transparent;--g-warm:transparent;--g-neutral:transparent;--card-edge:transparent;
  --g-watch-fg:#7E6512;--g-watch-bg:rgba(154,125,30,.13)}
/* типографика: 4 размера — число · заголовок · текст · подпись; без разрядки */
.lbl{font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink2)}
.secH{margin:0 2px 10px;align-items:center}
.secH .lbl,.sectionHead .lbl{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.secH>span:last-child,.sectionHead>span{font-size:13px}
.secH>span.lbl,.sectionHead>span.lbl{font-size:17px;color:var(--ink);text-align:left}
.ov-top .lbl{font-size:15px;color:var(--ink)}
.ov-hero>.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.stw{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:600}
.bioSub{font-size:13px;letter-spacing:.01em;text-transform:none;font-weight:500}
.hyp,.bbody .hyp,.brow .bt .hyp{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;background:var(--amber-soft);color:var(--amber);vertical-align:1px}
.pastTag,.v2 em{text-transform:none;letter-spacing:0}
.mac .lbl{font-size:12px;font-weight:500;color:var(--muted)}
.title{font-weight:500}
/* поверхности: плоские, без обводки и свечения */
.mcard,.bcard,.cons,.nextDraw,.labSum,.loop,.mac,.ckrow,.stk{background:var(--card);box-shadow:var(--card-sh)}
.mcard::before,.bcard::before,.cons::before,.nextDraw::before,.stk::before{display:none}
.bcard{border-radius:24px;padding:16px}
.cons.ready{box-shadow:inset 0 0 0 1.5px var(--accent)}
/* тон — только в круге иконки */
.mc-ic{width:40px;height:40px;background:var(--line-soft);box-shadow:none}
.mc-ic svg{width:18px;height:18px}
.bcard.teal .mc-ic,.bcard.green .mc-ic{background:var(--accent-soft)}.bcard.teal .mc-ic svg,.bcard.green .mc-ic svg{color:var(--accent-ink)}
.bcard.amber .mc-ic,.bcard.gold .mc-ic{background:var(--amber-soft)}.bcard.amber .mc-ic svg,.bcard.gold .mc-ic svg{color:var(--amber)}
.bcard.warm .mc-ic{background:var(--warm-soft)}.bcard.warm .mc-ic svg{color:var(--warm)}
.stw.gold{color:var(--amber)}
.pdot2,.pdot2::after{background:var(--accent)}
/* кнопки: одна основная — тёмная пилюля */
.btn.pri{background:var(--ink);color:var(--bg)}
.btnP{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:22px;border-radius:26px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600}
.btnP.done{background:var(--accent-soft);color:var(--accent-ink)}
/* строка списка — одна на все экраны: иконка в круге · название · значение · › */
.rows{border-radius:24px;background:var(--card);box-shadow:var(--card-sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;left:66px;right:0;top:0;border-top:1px solid var(--line-soft)}
.rIc{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--line-soft)}
.rIc svg{width:20px;height:20px;color:var(--ink2)}
.rIc.teal,.rIc.green{background:var(--accent-soft)}.rIc.teal svg,.rIc.green svg{color:var(--accent-ink)}
.rIc.amber,.rIc.gold{background:var(--amber-soft)}.rIc.amber svg,.rIc.gold svg{color:var(--amber)}
.rIc.warm{background:var(--warm-soft)}.rIc.warm svg{color:var(--warm)}
.rIc.ok{background:var(--green)}.rIc.ok svg{color:#fff;stroke-width:2.4;width:15px;height:15px}
.rIc.off{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.rT{flex:1;min-width:0}
.rT b{display:block;font-size:15px;font-weight:500;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rT small{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rT small.wrap,.rT b.wrap{white-space:normal}
.rV{flex:none;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right}
.rV.ok{color:var(--green)}.rV.am{color:var(--amber)}.rV.warm{color:var(--warm-ink)}
.rGo{flex:none;width:14px;height:14px;color:var(--faint)}
.rDot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.rDot.warm{background:var(--warm)}
.rN{flex:none;min-width:26px;height:22px;padding:0 7px;border-radius:11px;background:var(--line-soft);font-size:12px;font-weight:600;display:grid;place-items:center;color:var(--ink2)}
.rBtn{flex:none;height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft)}
.rBtn.on{background:none;color:var(--green)}
.rRing{flex:none;width:30px;height:30px}
.rRing circle{fill:none;stroke-width:3}
.rRing .bg{stroke:var(--line)}.rRing .fg{stroke:var(--accent);stroke-linecap:round}
.sec>.rows+.rows{margin-top:10px}
.gap{height:10px}
/* главная v6: взгляд — вердикт; тап — подробности */
.verdict{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:clamp(14px,2.2vh,22px);max-width:340px;padding:4px 10px;text-align:center}
.vk{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink)}
.vk i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.vk.ok i,.vk.week i{background:var(--green)}.vk.up i{background:var(--amber)}.vk.imp i{background:var(--warm)}.vk.closed i{background:var(--gold)}.vk.past i{background:var(--ink2)}
#todayTab.photo .vk.ok i,#todayTab.photo .vk.week i{background:#9EE6A0;box-shadow:0 0 10px rgba(158,230,160,.7)}
#todayTab.photo .vk.up i{background:#F0D27A;box-shadow:0 0 10px rgba(240,210,122,.7)}
#todayTab.photo .vk.imp i{background:#F4A58A;box-shadow:0 0 10px rgba(244,165,138,.7)}
#todayTab.photo .vk.closed i{background:#F0CF86}
.vt{font-family:var(--serif);font-size:clamp(28px,4vh,34px);font-weight:300;line-height:1.1;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.vt svg{display:inline-block;width:18px;height:18px;margin-left:4px;vertical-align:1px;color:var(--muted);stroke-width:1.8}
#todayTab.photo .vk,#todayTab.photo .vt{text-shadow:0 1px 14px rgba(4,12,24,.6),0 0 3px rgba(4,12,24,.5)}
#needYou .rows{margin-top:6px}
/* серии — кольца-медали: заполнение до следующей вехи, под угрозой — янтарь, пауза — пунктир */
.strow{display:block;width:100%;margin-top:0;padding:14px 10px 14px;border-radius:24px;background:var(--card);box-shadow:var(--card-sh);border-top:0;text-align:left}
.strow-h{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px}
.strow-h b{font-size:15px;font-weight:600}
.strow-h span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.strow-h span svg{width:13px;height:13px}
.strow-h .fzc{color:var(--accent-ink)}
.stRing{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.sr{display:flex;flex-direction:column;align-items:center;gap:5px}
.srC{position:relative;width:50px;height:50px;display:grid;place-items:center}
.srC .rg{position:absolute;inset:0;width:50px;height:50px;transform:rotate(-90deg);overflow:visible}
.srC .rg circle{fill:none;stroke-width:3.2}
.srC .rg .bg{stroke:var(--line)}
.srC .rg .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray 1.2s var(--ease)}
.srC>svg.ic{width:18px;height:18px;color:var(--ink2)}
.sr b{font-size:17px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.sr small{font-size:11.5px;line-height:1;color:var(--muted);white-space:nowrap}
.sr.best .fg{stroke:var(--gold)}.sr.best>svg{color:var(--gold)}
.sr.risk .fg{stroke:var(--amber)}.sr.risk .srC>svg.ic{color:var(--amber)}
.sr.risk .srC::after{content:"";position:absolute;inset:3px;border-radius:50%;box-shadow:0 0 0 2px var(--amber);opacity:0;animation:srpulse 2.4s ease-out infinite}
@keyframes srpulse{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.sr.risk small{color:var(--amber);font-weight:600}
.sr.pause .fg{stroke:var(--faint);stroke-dasharray:2 5!important}.sr.pause b{color:var(--muted)}.sr.pause small{color:var(--muted)}
/* шторка «Сегодня»: цифры → откуда → что даст → ещё можно → в норме */
.fbig{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.fbig b{font-size:64px;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.fbig span{font-size:15px;color:var(--muted)}
.fsub{margin-top:8px;font-size:14px;font-weight:500;color:var(--accent-ink)}
.fsub.am{color:var(--amber)}.fsub.warm{color:var(--warm-ink)}
/* bullet-бар: норма на ~75% ширины, дальше — зона перебора; заливка краснеет только за лимитом */
.bb{position:relative;height:10px;margin:22px 0 8px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--green) 16%,transparent) 0 75%,color-mix(in srgb,var(--warm) 16%,transparent) 75% 100%)}
.bb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);transition:width 1.1s var(--ease)}
.bb i.over{background:var(--warm)}
.bb em{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--amber)}
.bb u{position:absolute;left:75%;top:-6px;bottom:-6px;width:2px;border-radius:1px;background:var(--ink2);opacity:.55}
.bbL{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bbL b{font-weight:600;color:var(--amber)}
.fsec{margin-top:26px}
.fsec>.lbl{display:block;margin:0 2px 10px;font-size:17px;color:var(--ink)}
.fsec>.lbl small{font-size:13px;color:var(--muted);margin-left:8px}
.fsec .src{padding:9px 2px}
.quietRow{display:flex;align-items:center;gap:8px;margin:14px 4px 0;font-size:13px;color:var(--muted)}
.quietRow svg{width:14px;height:14px;color:var(--green)}
.whyRow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:16px;font-size:13.5px;color:var(--muted)}
.whyRow svg{width:14px;height:14px}
/* Проверки: переключатель вместо четырёх чисел, однострочные ряды */
.seg{display:flex;gap:4px;margin-top:16px;padding:4px;border-radius:18px;background:var(--line-soft)}
.seg button{flex:1;height:40px;border-radius:14px;font-size:14px;font-weight:500;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .3s ease,color .3s ease}
.seg button b{font-weight:600;font-size:12px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--line-soft);color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--card-sh)}
.seg button.hot b{background:var(--accent);color:#fff}
.qsec{margin-top:22px}
.qsec>.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px;font-size:17px;color:var(--ink)}
.qsec>.lbl small{font-size:13px;font-weight:400;color:var(--muted)}
.qsec .mcard.rx{border-radius:24px}
/* Врач: три строки + одна карточка сдачи; подробности — в шторке «Что сдаём» */
#docRows{margin-top:18px}
.nextDraw{margin-top:0;padding:18px 18px 18px}
.nd-k{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.nd-k b{font-weight:600;color:var(--accent-ink)}
.nd-d{margin-top:6px}
.nd-q2{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:16px;background:var(--amber-soft);font-size:13.5px;line-height:1.35}
.nd-q2 span{flex:1}
.nd-q2 button{flex:none;font-size:13px;font-weight:600;color:var(--accent-ink);min-height:36px}
.nextDraw .btnP{margin-top:16px}
.drawW div{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:2px;align-items:baseline;padding:11px 2px;border-top:1px solid var(--line-soft);font-size:14px}
.drawW div:first-child{border-top:0}
.actSt{display:block;margin-top:5px;font-style:normal;font-size:12px;font-weight:500;color:var(--muted)}.actSt.ok{color:var(--accent-ink)}
.drawW b{grid-column:1;font-weight:600}.drawW span{grid-column:1/-1;grid-row:2;font-size:13px;line-height:1.4;color:var(--muted)}.drawW em{grid-column:2;grid-row:1;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
/* Я: биовозраст как у Longevity — паспорт и био рядом, дельта; «Что дало» — образ жизни и кровь; системы органов */
.ageCard{margin-top:18px;padding:16px;border-radius:24px;background:linear-gradient(135deg,#2C8981 0%,#4F9E6E 100%);color:#fff}
:root[data-theme="dark"] .ageCard{background:linear-gradient(135deg,#1F5F5A 0%,#2F6B4A 100%)}
.ageH{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.ageH em{font-style:normal;height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.2);font-size:13px;font-weight:600;display:grid;place-items:center}
.ageT{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.ageT small{display:block;font-size:12.5px;opacity:.8}
.ageT .bio b{display:block;margin-top:6px;font-size:54px;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ageT .bio b span{font-size:16px;font-weight:400;margin-left:6px;opacity:.75;letter-spacing:0}
.ageP{text-align:right;font-size:12.5px;opacity:.85;padding-bottom:4px}
.ageP b{display:block;font-size:20px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.ageF{margin-top:12px;font-size:12.5px;opacity:.85}
.bioChart{margin-top:10px;padding:10px 14px 6px;border-radius:24px;background:var(--card);box-shadow:var(--card-sh)}
.bioChart .chart{margin-top:4px}
.seg.sm{margin-top:0}
.gv{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line-soft)}
.gv:first-child{border-top:0}
.gv>svg{flex:none;width:17px;height:17px;color:var(--ink2)}
.gv .gn{flex:none;width:124px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv .gb{flex:1;position:relative;height:8px;border-radius:4px;background:var(--line-soft)}
.gv .gb i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.gv .gb i.old{background:var(--amber)}
.gv .gd{flex:none;width:56px;white-space:nowrap;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;color:var(--accent-ink);font-weight:600}
.gv .gd.old{color:var(--amber)}.gv .gd.zero{color:var(--muted);font-weight:400}
.gv.end .gn,.gv.end .gd{font-weight:600;color:var(--ink)}
.gv.end .gb i{background:var(--ink2);width:3px!important;border-radius:2px;top:-4px;bottom:-4px}
.gvAx{display:flex;justify-content:space-between;padding:8px 0 0 134px;margin-right:66px;font-size:11px;color:var(--muted)}
.gv .gb.c::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
.gvMore{display:block;width:100%;padding:12px 0 10px;border-top:1px solid var(--line-soft);font-size:13px;font-weight:600;color:var(--accent-ink);text-align:center}
.gvCard{padding:6px 14px;border-radius:24px;background:var(--card);box-shadow:var(--card-sh)}
.gvNote{margin:10px 4px 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.sysGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sysC{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:22px;background:var(--card);box-shadow:var(--card-sh);text-align:left}
.sysC .rIc{width:40px;height:40px}.sysC .rIc svg{width:23px;height:23px}
.sysOk{display:flex;align-items:flex-start;gap:10px;width:100%;margin-top:10px;padding:14px;border-radius:22px;background:var(--card);box-shadow:var(--card-sh);text-align:left;font-size:13px;line-height:1.45;color:var(--muted)}
.sysOk i{flex:none;width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--green)}
.sysC b{font-size:15px;font-weight:500}
.sysC small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sysC small i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sysC small i.w{background:var(--amber)}.sysC small i.o{background:var(--warm)}
/* Питание: лимит — bullet-бар (лимит на 75%, дальше зона перебора); микро — тепловая карта недели */
.lever .bb{margin:14px 0 2px}
.lever.nodata .bb{background:none;border-top:1.5px dashed var(--faint);height:0;margin-top:16px}
.hm{padding:6px 14px 10px;border-radius:24px;background:var(--card);box-shadow:var(--card-sh)}
.hmH,.hmR{display:grid;grid-template-columns:84px repeat(7,minmax(0,1fr)) 40px;align-items:center;column-gap:4px}
.hmH{padding:8px 0 4px;font-size:11px;color:var(--muted);text-align:center}
.hmH span:first-child{text-align:left}
.hmR{width:100%;padding:7px 0;text-align:left;border-top:1px solid var(--line-soft)}
.hmR>span:first-child{font-size:14px}
.hmR i{width:min(20px,100%);aspect-ratio:1;border-radius:50%;justify-self:center;background:transparent;box-shadow:inset 0 0 0 1.2px var(--line)}
/* Палитра Vita: количества («сколько набрано») — бирюзовый акцент, как полоски БЖУ и лимитов; перебор — тёплый терракотовый, как .bb i.over.
   0–100%+ нормы — четыре ступени акцента (выше 100 — как 100); пустой кружок — нет данных. Зелёный --green в продукте — статус «в порядке», не шкала. */
.hmR i.g1{background:color-mix(in srgb,var(--accent) 24%,transparent);box-shadow:none}
.hmR i.g2{background:color-mix(in srgb,var(--accent) 46%,transparent);box-shadow:none}
.hmR i.g3{background:color-mix(in srgb,var(--accent) 72%,transparent);box-shadow:none}
.hmR i.g4{background:var(--accent);box-shadow:none}
.hmR i.hot{background:var(--warm);box-shadow:none}
.hmR i.today{outline:1.6px solid var(--ink);outline-offset:0}
.hmH span.td{font-weight:700;color:var(--ink)}
.hmR>span:first-child small{display:block;margin-top:1px;font-size:11px;line-height:1.2;color:var(--muted)}
.hmR em{font-style:normal;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.hmA{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.hmA>div{overflow:hidden}
.hmA p{padding:2px 0 10px;font-size:13px;line-height:1.45;color:var(--ink2)}
.hmA p b{color:var(--accent-ink);font-weight:600}
.hmW.open .hmA{grid-template-rows:1fr}
.hmOk{display:flex;align-items:center;gap:8px;padding:10px 0 2px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.hmOk svg{width:14px;height:14px;color:var(--green)}
/* шторки: контейнер растёт из формы кнопки и возвращается в неё; фон — отдельный слой, содержимое растворяется */
.morph{position:absolute;inset:0;z-index:29;display:none;background:var(--bg);pointer-events:none;will-change:clip-path,opacity,transform}
.ov{background:transparent;will-change:opacity,transform}
.stage{transition:transform .44s cubic-bezier(.2,0,0,1)}
.stage.behind{transform:scale(.96)}
#app.morphing .tbPhoto i,#app.morphing .tbGlow,#app.morphing .arcHalo,#app.morphing .arcSvg.live .arcTick,#app.morphing .stPill i,#app.morphing .pdot2::after{animation-play-state:paused}
#app.morphing .chipC,#app.morphing .stPill{-webkit-backdrop-filter:none;backdrop-filter:none}
.ov.drag .screen{overflow:hidden}
.ov.drag{-webkit-user-select:none;user-select:none}
/* шапка: дата и режим слева, серии — стеклянная пилюля справа (пламя + точка на серию) */
.hdr{height:48px}
.dcol{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
#tDate{font-size:13.5px;font-weight:500;color:var(--ink)}
.tSub{display:flex;align-items:center;gap:6px;min-height:20px;font-size:12px;color:var(--ink2);white-space:nowrap}
.tSub .dot-live{width:6px;height:6px}
.stPill{position:relative;flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 13px 0 11px;border-radius:18px;background:var(--chip-bg);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.stPill[hidden]{display:none}
.stPill>svg{width:16px;height:16px;color:var(--gold);stroke-width:1.7}
.stPill.risk>svg{color:var(--amber)}
#todayTab.photo .stPill.risk>svg{color:#F0D27A}
.sd{display:flex;gap:5px}
.sd i{width:7px;height:7px;border-radius:50%;background:var(--green);transition:transform .5s var(--spring)}
#todayTab.photo .sd i{background:#9EE6A0;box-shadow:0 0 6px rgba(158,230,160,.55)}
.sd i.r,#todayTab.photo .sd i.r{background:#F0D27A;box-shadow:0 0 6px rgba(240,210,122,.7);animation:sdr 2.2s ease-in-out infinite}
@keyframes sdr{50%{transform:scale(1.35)}}
.sd i.p,#todayTab.photo .sd i.p{background:none;box-shadow:inset 0 0 0 1.3px var(--faint)}
/* вечер: день закрыт — точки вспыхивают по очереди, «+1» всплывает */
.stPill.plus .sd i:not(.p){animation:sdplus .9s var(--spring) both;animation-delay:calc(var(--k)*90ms)}
@keyframes sdplus{0%{transform:scale(1)}40%{transform:scale(1.8)}100%{transform:scale(1)}}
.stPill.plus::after{content:"+1 день";position:absolute;right:6px;top:100%;margin-top:6px;font-size:12px;font-weight:600;color:#F0CF86;white-space:nowrap;text-shadow:0 1px 8px rgba(4,12,24,.6);animation:plusup 2.4s var(--ease) .5s both}
@keyframes plusup{0%{opacity:0;transform:translateY(-6px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(4px)}}
/* шторка «Серии»: строка = иконка · название · число; под ней — 14 дней */
.stList{margin-top:18px;border-radius:24px;background:var(--card);box-shadow:var(--card-sh);padding:4px 14px}
.stR2{padding:12px 0 14px;border-top:1px solid var(--line-soft)}
.stR2:first-child{border-top:0}
.stR2h{display:flex;align-items:center;gap:12px}
.stN{flex:none;font-size:26px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.stN small{font-size:12px;color:var(--muted);margin-left:3px;letter-spacing:0}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:10px 0 0 52px}
.strip i{height:14px;border-radius:4px;background:var(--line-soft);display:grid;place-items:center}
.strip i.y{background:var(--accent)}
.strip i.f{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.strip i.f svg{width:9px;height:9px;color:var(--accent-ink)}
.strip i.p{background:none;box-shadow:inset 0 0 0 1.2px var(--faint)}
.strip i.t{background:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.stR2.risk .strip i.t{box-shadow:inset 0 0 0 1.5px var(--amber)}
.stR2.risk .rT small{color:var(--amber);font-weight:600}
.stR2.pause .stN{color:var(--muted)}
.stLeg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 4px 0;font-size:12px;color:var(--muted)}
.stLeg span{display:flex;align-items:center;gap:6px}
.stLeg i{width:12px;height:12px;border-radius:3px}
</style>
</head>
<body>
<div id="controls">
  <button id="themePill" class="pill" data-a="theme"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg><span id="themeLabel">Тема: светлая</span></button>
</div>
<div id="app">
  <div id="netBan" hidden>Нет соединения — показаны последние данные</div>
  <div class="pullRefresh" id="pullRefresh"><span class="prSpin"></span></div>
  <main class="stage" id="stage">
    <!-- СЕГОДНЯ -->
    <section class="tab on photo" data-tab="today" id="todayTab" aria-label="Сегодня">
      <div class="todayBg" id="todayBg" aria-hidden="true"><div class="tbGlow"></div><div class="tbPhoto"><i></i></div></div>
