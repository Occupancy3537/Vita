                    <h3 id="headingfpnj3">Что такое гликированный гемоглобин</h3><p>Гемоглобин&nbsp;&mdash; это железосодержащий белок. Он&nbsp;входит в&nbsp;состав эритроцитов&nbsp;&mdash; клеток крови. Гемоглобин переносит по&nbsp;организму кислород и&nbsp;придаёт крови красный цвет. Существует несколько разновидностей гемоглобина, но&nbsp;основной его тип&nbsp;&mdash; гемоглобин альфа-1 (HbA1).</p><p>Глюкоза&nbsp;&mdash; углевод, основной источник энергии для клеток. Она поступает с&nbsp;пищей, всасывается в&nbsp;кровь, циркулирует в&nbsp;ней и&nbsp;распределяется по&nbsp;органам и&nbsp;тканям. За&nbsp;обмен глюкозы и&nbsp;её&nbsp;оптимальный уровень отвечают два основных гормона поджелудочной железы&nbsp;&mdash; инсулин и&nbsp;глюкагон.</p><p>Если развивается заболевание поджелудочной железы или в&nbsp;рационе преобладают быстрые углеводы, организм перестаёт справляться с&nbsp;усвоением глюкозы. Высокий уровень сахара в&nbsp;крови&nbsp;&mdash; гипергликемия&nbsp;&mdash; приводит к&nbsp;тому, что молекулы глюкозы начинают активно &laquo;склеиваться&raquo; с&nbsp;молекулами гемоглобина. Учёные называют такую химическую реакцию гликированием, а&nbsp;получившийся в&nbsp;её&nbsp;результате белково-углеводный комплекс&nbsp;&mdash; гликированным гемоглобином (HbA1c).</p><p>Освободиться от&nbsp;глюкозы такой гемоглобин уже не&nbsp;может. Он&nbsp;циркулирует в&nbsp;кровотоке вместе с&nbsp;эритроцитами вплоть до&nbsp;распада последних. Средний срок жизни красной кровяной клетки&nbsp;&mdash; около 120&nbsp;дней.</p><p>Таким образом, анализ на&nbsp;гликированный гемоглобин выявляет повышение глюкозы в&nbsp;ретроспективе&nbsp;&mdash; за&nbsp;последние три месяца до&nbsp;исследования. По&nbsp;этой причине его часто используют для ранней диагностики сахарного диабета и&nbsp;предиабета, а&nbsp;также для контроля эффективности лечения этих заболеваний.</p><p>В&nbsp;норме гликированный гемоглобин содержится в&nbsp;крови в&nbsp;небольших количествах. На&nbsp;уровень HbA1c, кроме нарушений эндокринной системы, могут влиять различные патологии внутренних органов, крови, перенесённые операции и&nbsp;процедуры переливания.</p><p>Также на&nbsp;количество гликогемоглобина влияют беременность, дефицит витаминов, алкогольная зависимость, некоторые хронические заболевания (например, ревматоидный артрит), а&nbsp;также приём лекарственных препаратов.</p><h3 id="headingrn28f">Предиабет, гестационный и&nbsp;сахарный диабет</h3><p><b>Предиабет</b></p><p>Предиабет&nbsp;&mdash; нарушение обмена веществ, при котором клетки не&nbsp;могут быстро усвоить глюкозу. Основной признак предиабета&nbsp;&mdash; высокое содержание глюкозы в&nbsp;крови, или гипергликемия.</p><p>Предиабет предшествует развитию сахарного диабета 2-го типа&nbsp;&mdash; хронического эндокринного заболевания. В&nbsp;отличие от&nbsp;сахарного диабета, предиабет обратим: своевременная диагностика, лечение и&nbsp;диета предотвращают развитие болезни или откладывают её&nbsp;наступление.</p><p>По&nbsp;результатам анализа на&nbsp;гликированный гемоглобин можно судить о&nbsp;длительности предиабета и&nbsp;оценить риск развития сахарного диабета. Обычно исследование назначается с&nbsp;комплексом других анализов.</p><p><b>Сахарный диабет</b></p><p>Сахарный диабет&nbsp;&mdash; хроническое эндокринное заболевание, связанное с&nbsp;нарушением обмена веществ и&nbsp;усвоения глюкозы. Как правило, выделяют три основных типа сахарного диабета: 1-й тип, 2-й тип и&nbsp;гестационный. Все варианты заболевания связаны с&nbsp;количеством инсулина в&nbsp;крови и&nbsp;со&nbsp;способностью клеток реагировать на&nbsp;него.</p><p>Инсулин&nbsp;&mdash; гормон поджелудочной железы, участвует в&nbsp;обмене веществ и&nbsp;помогает глюкозе попадать в&nbsp;клетки.</p><p>Сахарный диабет 1-го типа (инсулинозависимый)&nbsp;&mdash; это аутоиммунное заболевание, при котором иммунитет уничтожает клетки поджелудочной железы, отвечающие за&nbsp;выработку инсулина. Как следствие, его не&nbsp;хватает, и&nbsp;организм не&nbsp;может усвоить большую часть глюкозы.</p><p>Сахарный диабет 2-го типа (инсулиннезависимый)&nbsp;&mdash; заболевание, связанное с&nbsp;нарушением обмена веществ. Клетки организма не&nbsp;реагируют на&nbsp;инсулин (приобретают инсулинорезистентность), и&nbsp;глюкоза в&nbsp;них не&nbsp;поступает. Большое количество глюкозы в&nbsp;крови приводит к&nbsp;гликированию не&nbsp;только гемоглобина, но&nbsp;и&nbsp;других жизненно важных белков в&nbsp;организме.</p><p><b>Наиболее распространённые причины и&nbsp;факторы предиабета и&nbsp;диабета</b>:</p><ul><li>наследственность;</li><li>предшествующее аутоиммунное заболевание;</li><li>ожирение;</li><li>неправильное питание, избыток углеводов в&nbsp;пище;</li><li>нарушение обмена веществ из-за патологий внутренних органов;</li><li>малоподвижный образ жизни;</li><li>некоторые вирусные инфекции;</li><li>приём лекарственных препаратов, в&nbsp;том числе кортикостероидов и&nbsp;противозачаточных средств;</li><li>хронический панкреатит (воспаление поджелудочной железы).</li></ul><p>Сахарный диабет 1-го и&nbsp;2-го типа&nbsp;&mdash; неизлечимые заболевания эндокринной системы. Результат анализа на&nbsp;гликогемоглобин в&nbsp;случае сахарного диабета позволяет определить длительность и&nbsp;динамику развития заболевания, контролировать эффективность лечения.</p><p><b>Гестационный диабет</b></p><p>Гестационный диабет&nbsp;&mdash; это диабет беременных. Чаще всего проявляется во&nbsp;втором&mdash;третьем триместре из-за роста плаценты, которая выполняет функции отдельного эндокринного органа и&nbsp;влияет на&nbsp;метаболизм углеводов. Предпосылкой для возникновения гестационного диабета может стать избыточная масса тела беременной, предиабетическое состояние или наследственная предрасположенность к&nbsp;сахарному диабету.</p><p>В&nbsp;отличие от&nbsp;сахарного диабета 1-го и&nbsp;2-го типа, гестационный диабет, как правило, проходит после родов.</p><h3 id="headingdjimu">Источники</h3><ol><li>Алгоритмы специализированной медицинской помощи больным сахарным диабетом&nbsp;/ под редакцией И.&nbsp;И.&nbsp;Дедова, М.&nbsp;В. Шестаковой, А.&nbsp;Ю.&nbsp;Майорова. 9-й выпуск (дополненный). М., 2019.</li><li>Classification and diagnosis of&nbsp;diabetes: Standards of&nbsp;Medical Care in&nbsp;Diabetes&mdash;2020&nbsp;/ American Diabetes Association // Diabetes Care, 2020. <a href="https://doi.org/10.2337/dc20-S002" >doi:10.2337/dc20-S002</a></li><li>Strock E.&nbsp;S. How Should Hemoglobin A1c (HbA1c) Results Be&nbsp;Interpreted in&nbsp;Your Patients with Diabetes // Medscape, 2001.</li></ol>
